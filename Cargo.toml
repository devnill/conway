[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-only"
# Publishing to crates.io is DEFERRED, not refused: the operator intends to do
# it eventually, it is simply not a priority now. So the direction is settled
# and only the timing is open -- do not re-litigate whether to publish, and do
# not treat this flag as a position against it.
#
# The guard exists because a crates.io release cannot be withdrawn: an
# accidental `cargo publish` would force the timing irreversibly. Flip it when
# publishing is actually on the roadmap.
#
# Do NOT read a rationale into the AGPL-3.0-only line above. The licence is a
# made decision; the publishing timeline is a separate, open one.
publish = false
rust-version = "1.88.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }
static_assertions = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
humantime-serde = "1"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
eventsource-stream = "0.2"
url = { version = "2", features = ["serde"] }
rand = "0.10"
regex = "1"
jsonschema = { version = "0.48", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
tokio-stream = "0.1"
wiremock = "0.6"
tempfile = "3"
ignore = "0.4"
globset = "0.4"
nix = "0.29"
# Open-relative (`openat`-family), capability-based filesystem access: the
# manual per-component walk this crate would otherwise have to hand-write
# (refusing an intermediate OR leaf symlink that resolves outside a sandbox
# `Dir`, at OPEN time, not at a separate pre-check) to close the TOCTOU gap a
# canonicalize-then-open two-step can never close. Used by `conway-tools`'
# `fs::beneath` -- see that module's own doc for why a hand-rolled `openat`
# loop over `nix` was rejected in favor of this.
cap-std = "4"
lru = "0.18"
proptest = "1"
serde_yaml = "0.9"
directories = "5"
clap = "4"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
assert_cmd = "2"
predicates = "3"
httparse = "1"
# Capability-edge version resolution (`conway-core`'s `ports::capability`,
# decision `01M189XS6Z9VKYENAHNY1B54CM`): a provider declares a
# `semver::Version`, a consumer a `semver::VersionReq`, and the host checks
# `req.matches(&version)`. Already present in `Cargo.lock` at 1.0.28 (pulled
# in transitively by `rustc_version`) before this promotion -- this line adds
# no new entry to the lock, only a direct dependency edge onto one that was
# already there.
semver = "1"
# Board item `01M2M6NR49FYQSRS00B95PTAZT`: the compiled-binary TUI test
# harness (`crates/conway-cli/tests/common/pty.rs`) spawns `conway` attached
# to a REAL pseudo-terminal with an explicit window size, the one thing
# `std::process::Command`'s piped `Stdio` (every other suite in that
# directory) cannot give a subprocess -- `main.rs`'s own `IsTerminal` check
# is exactly why the interactive guided-setup flow, `/model`, `/role`, and
# permission-mode cycling were untestable against the real binary before
# this. `portable-pty` (the wezterm project's own pty-allocation crate) over
# `expectrl`: both are Unix-only-adequate for this repo's actual CI/dev
# footprint (Linux + macOS, no Windows job -- `.github/workflows/ci.yml`'s
# own `windows-latest` comment), but `portable-pty` is the actively
# maintained one (versioned and released alongside wezterm itself, still
# shipping), while `expectrl`'s last activity is comparatively stale.
# Neither ships a "wait for text" primitive tuned to a full-screen ratatui
# app (both assume a line-oriented `expect`-style program); `pty.rs` writes
# its own `wait_for_any`, deliberately kept to substring/pattern matching
# over the ANSI-stripped output stream rather than a real VT100 grid (see
# that module's own doc for why a full terminal emulator is unneeded and
# was rejected as a SECOND new dependency this item's budget does not
# allow). Dev-only, `conway-cli`'s own `[dev-dependencies]`: nothing in any
# `src/` may name it.
portable-pty = "0.8"

# ---------------------------------------------------------------- profiles ----
#
# Debug builds default to full DWARF for the workspace AND every dependency,
# which is what made `target/` unmanageable: this workspace produces ~131 test
# binaries, cargo never garbage-collects the stale generations they leave
# behind, and `target/` reached 175 GiB (1.39M files) by 2026-08-13 -- filling
# a 460 GiB disk and forcing manual cleanup roughly daily.
#
# What is kept and what is given up:
#
#   debug = "line-tables-only" for workspace crates keeps FILE AND LINE
#   NUMBERS in panics and backtraces, which is what this project's debugging
#   actually rests on -- a failing test prints where it failed, and
#   `RUST_BACKTRACE=1` still resolves symbols to source positions. What is
#   given up is variable inspection under a step-debugger (lldb/gdb showing
#   local values). Nobody working here has needed that; if you do, flip this
#   line back to `debug = true` locally rather than committing it.
#
#   debug = false for dependencies drops their debuginfo entirely. Backtraces
#   through third-party frames keep function names (those come from symbols,
#   not DWARF) and lose only the file:line for code that is not ours.
#
# Release builds are untouched, so nothing about shipped artifacts changes.
#
# Incremental compilation is deliberately LEFT ON despite accounting for 32 GB
# of the 2026-08-13 total: it is what keeps the edit-test loop fast, and the
# growth is stale generations rather than active state. Periodic `cargo clean`
# handles it -- see the operator memory on this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
