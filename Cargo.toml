[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }
