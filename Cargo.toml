[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "AGPL-3.0-only"
# Publishing to crates.io is DEFERRED, not refused: the operator intends to do
# it eventually, it is simply not a priority now. So the direction is settled
# and only the timing is open -- do not re-litigate whether to publish, and do
# not treat this flag as a position against it.
#
# The guard exists because a crates.io release cannot be withdrawn: an
# accidental `cargo publish` would force the timing irreversibly. Flip it when
# publishing is actually on the roadmap.
#
# Do NOT read a rationale into the AGPL-3.0-only line above. The licence is a
# made decision; the publishing timeline is a separate, open one.
publish = false
rust-version = "1.88.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }
static_assertions = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
humantime-serde = "1"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
eventsource-stream = "0.2"
url = { version = "2", features = ["serde"] }
rand = "0.10"
regex = "1"
jsonschema = { version = "0.48", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
tokio-stream = "0.1"
wiremock = "0.6"
tempfile = "3"
ignore = "0.4"
globset = "0.4"
nix = "0.29"
lru = "0.18"
proptest = "1"
serde_yaml = "0.9"
directories = "5"
clap = "4"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
assert_cmd = "2"
predicates = "3"
httparse = "1"

# ---------------------------------------------------------------- profiles ----
#
# Debug builds default to full DWARF for the workspace AND every dependency,
# which is what made `target/` unmanageable: this workspace produces ~131 test
# binaries, cargo never garbage-collects the stale generations they leave
# behind, and `target/` reached 175 GiB (1.39M files) by 2026-08-13 -- filling
# a 460 GiB disk and forcing manual cleanup roughly daily.
#
# What is kept and what is given up:
#
#   debug = "line-tables-only" for workspace crates keeps FILE AND LINE
#   NUMBERS in panics and backtraces, which is what this project's debugging
#   actually rests on -- a failing test prints where it failed, and
#   `RUST_BACKTRACE=1` still resolves symbols to source positions. What is
#   given up is variable inspection under a step-debugger (lldb/gdb showing
#   local values). Nobody working here has needed that; if you do, flip this
#   line back to `debug = true` locally rather than committing it.
#
#   debug = false for dependencies drops their debuginfo entirely. Backtraces
#   through third-party frames keep function names (those come from symbols,
#   not DWARF) and lose only the file:line for code that is not ours.
#
# Release builds are untouched, so nothing about shipped artifacts changes.
#
# Incremental compilation is deliberately LEFT ON despite accounting for 32 GB
# of the 2026-08-13 total: it is what keeps the edit-test loop fast, and the
# growth is stale generations rather than active state. Periodic `cargo clean`
# handles it -- see the operator memory on this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
