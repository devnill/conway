[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.94.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
schemars = "0.8"
ulid = { version = "1", features = ["serde"] }
static_assertions = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
humantime-serde = "1"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
eventsource-stream = "0.2"
url = { version = "2", features = ["serde"] }
rand = "0.10"
regex = "1"
jsonschema = { version = "0.48", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
tokio-stream = "0.1"
wiremock = "0.6"
tempfile = "3"
ignore = "0.4"
globset = "0.4"
nix = "0.29"
lru = "0.12"
proptest = "1"
serde_yaml = "0.9"
directories = "5"
clap = "4"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
assert_cmd = "2"
predicates = "3"
httparse = "1"
