name: CI

# Supersedes the old `feature-matrix.yml`, which ran `cargo check -p conway`
# across feature combinations and nothing else. That guard was narrower than
# its name suggested: because it never COMPILED tests, it could not catch a
# test that fails to build under a feature combination -- and two such tests
# (`conway_ask.rs` ungated, and a `plugin_surface.rs` test gated on the wrong
# feature) sat broken and invisible until
# retired the backend feature flags and exposed them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant. Cancelling it
# keeps queue depth (and Actions minutes) down, which matters because the
# feature matrix alone is six jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # First because it is the cheapest signal in the workflow: rustfmt parses and
  # reprints, it never compiles, so this reports in well under a minute while
  # the other three jobs are still building.
  #
  # The workspace was reformatted in 5bf6635 (115 files) and `rustfmt.toml`
  # pins `style_edition` so an edition bump cannot silently reformat the tree
  # and undo it. Before that, this gate would have been red on arrival, which
  # is why it did not exist.
  fmt:
    name: cargo fmt (--check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt

      # No Swatinem/rust-cache here on purpose: nothing is compiled, so there
      # is no build output worth restoring and the cache round trip would cost
      # more than the check.
      #
      # `scripts/check-fast-gates.sh --gate "<name>"` rather than the command
      # inline: this and the local `check-fast-gates.sh` run are the same
      # code path, not two hand-kept spellings of the same command that can
      # drift apart (board item 01M0TJC2GY2C81Y9R1KKWT5PJJ).
      - name: cargo fmt --all --check
        run: scripts/check-fast-gates.sh --gate "cargo fmt (--check)"

  # If you are adding a `windows-latest` (or any non-Unix) job here: this
  # workspace's Windows home-directory resolution is currently UNTESTED, on
  # purpose, not by oversight (board item `01M18Q8AASY761DQ5HNN83TFY4`).
  # `directories::BaseDirs::home_dir()` -- the one lookup every home-
  # directory-dependent code path in this tree goes through
  # (`conway_core::containment`'s private `home_dir`, `conway::config::
  # discovery::home_settings_path`) -- resolves via the Windows Known
  # Folder API (`SHGetKnownFolderPath`/`FOLDERID_Profile`) and does NOT
  # read `%USERPROFILE%` at all; researched against the vendored
  # `dirs-sys-0.4.1`/`directories-5.0.1` source, no override knob exists.
  # Three compiled-binary tests that simulate a home directory by
  # overriding `HOME`/`USERPROFILE` on a spawned child are consequently
  # `#[cfg(unix)]`-gated (or, in one case, verified not to depend on the
  # override at all) rather than silently asserting against whatever this
  # runner's real profile directory happens to contain:
  # `crates/conway-cli/tests/tilde_expansion.rs`,
  # `crates/conway-cli/tests/config_isolation_binary.rs` (decision and
  # rejected alternatives recorded in that file's module doc), and
  # `crates/conway-cli/tests/global_instructions_isolation.rs`. A
  # `windows-latest` job will run these files' non-gated tests only; the
  # Windows-specific coverage those gated tests would have provided does
  # not exist anywhere else in this tree today.
  test:
    name: cargo test (workspace, all features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      # `conway-plugin-confine`'s Linux containment test
      # (`linux_containment::bwrap_confines_writes_but_not_reads`,
      # `crates/conway-plugin-confine/tests/confine_end_to_end.rs`) probes
      # for `bwrap` at `conway_plugin_confine::DEFAULT_PRIMITIVE_PATH`
      # (`/usr/bin/bwrap`) and SKIPS -- prints why, does not fail -- when
      # it is absent. `bubblewrap` is not part of the `ubuntu-latest`
      # runner image (`actions/runner-images`'s own package inventory for
      # that image names no such package), and no job in this workflow
      # ever installed it, so the skip fired on every run of this job,
      # silently, and CI reported this crate green without that half of
      # its containment claim ever running. `apt-get install bubblewrap`
      # puts the binary at the exact absolute path the test already
      # probes -- no PATH change needed. Board item
      # `01M3DK6XS64DRRGPJTVHC1XPH5`.
      #
      # NAMED RESIDUAL GAP (P-15): this makes the test EXECUTE, which is
      # the gap this item closes -- but the "temporarily defeat the
      # confinement and watch this same test fail" half of P-15 is not
      # automated here, on purpose, for the identical reason the macOS
      # mirror test gives in its own doc comment
      # (`write_outside_root_is_refused_and_absent`): doing so inside the
      # shipped binary would need either a permanent second "unconfined"
      # launcher checked into the tree, or a runtime switch that could
      # itself silently regress to unconfined -- the exact defect class
      # this whole plugin exists to make impossible. That demonstration
      # stays a one-time manual recipe run by the build lane, not a CI
      # gate.
      #
      # THE INSTALL ALONE IS NOT ENOUGH, learned from CI run 36209070740.
      # With `bubblewrap` installed but nothing else changed, the test ran
      # and failed at its FIRST assertion -- "write inside root should
      # succeed" -- with `bwrap: setting up uid map: Permission denied`.
      # That is not a conway defect: Ubuntu 23.10 and later ship
      # `kernel.apparmor_restrict_unprivileged_userns=1`, which forbids the
      # unprivileged user namespace `bwrap` must create, so `bwrap` cannot
      # confine anything at all on a default `ubuntu-latest` runner. The
      # sysctl below relaxes exactly that one restriction, on an ephemeral
      # CI VM, for the duration of this job. `|| true` so a runner image
      # without the knob does not fail the step -- if the relaxation does
      # not take, the containment test fails loudly rather than silently
      # skipping, which is the behaviour this whole item is about.
      - name: Install bubblewrap (bwrap, for conway-plugin-confine's Linux containment test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if bwrap --ro-bind / / --dev /dev true; then
            echo "bwrap smoke test OK"
          else
            echo "::warning::bwrap cannot create a namespace on this runner --"\
                 "conway-plugin-confine's Linux containment test will fail" \
                 "below, loudly, rather than skipping. That failure is an" \
                 "environment problem, not a containment defect: check" \
                 "kernel.apparmor_restrict_unprivileged_userns."
          fi

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --no-fail-fast

  # The falsifiable claims `scripts/board-claims.md` declares about the tree,
  # each owned by an open board item -- the completeness contract that makes
  # `PHILOSOPHY.md`'s present-tense exemption safe (`CONTRIBUTING.md` §2), and
  # nothing enforced it for a long time. The prose ledger this replaced went
  # stale on its highest-traffic entry while `docs/plugins/hooks.md`, which
  # IS gated, stayed exact. The difference was enforcement, not care.
  #
  # Pure Python over the repo, no toolchain and no build: it runs in seconds and
  # needs nothing but a checkout, which is why it sits first with `fmt`. CI has
  # no `.ideate-work/board.db` (gitignored local tooling state), so the
  # board_item cross-check this script can also do on a maintainer checkout
  # does not run here -- the predicate evaluation itself does not need it.
  design-claims:
    name: design claims (board-sourced predicates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same invocation as `scripts/check-fast-gates.sh --gate "design claims
      # (board-sourced predicates)"` -- kept as one code path so the local and
      # CI runs cannot spell this gate two different ways (01M0TJC2GY2C81Y9R1KKWT5PJJ).
      - name: python3 scripts/check-design-claims.py
        run: scripts/check-fast-gates.sh --gate "design claims (board-sourced predicates)"

  # The steering-shorthand half of `check-board-citations.py` -- bare `GP-*`/
  # `P-*`/`C-*` ids from `.ideate/steering/` (gitignored, unresolvable outside
  # a maintainer checkout) leaking onto a page a third party actually reads,
  # now including a `pub` item's own rustdoc comment in a library crate's
  # `src/` (`scan_rustdoc_shorthand`, board item `01M18Q8YWWQC6CNQSVCENGFC9B`)
  # -- a plugin author reading `cargo doc` has exactly as little access to
  # that directory as a reader of a `.md` page does.
  # Needs no store, unlike this script's OTHER half (ULID citation
  # resolution against `.ideate-work/board.db`/`.ideate/record`), which CI
  # cannot run -- both are `.gitignore`d local tooling state, and committing
  # them was declined. The script itself prints "CITATION-RESOLUTION HALF
  # SKIPPED" and still exits 0 on a clean steering-shorthand pass, so this
  # job gates what CI genuinely can check rather than always failing on a
  # half it never had the stores for.
  board-citations:
    name: board citations (steering-shorthand half)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Same invocation as `scripts/check-fast-gates.sh --gate "board
      # citations (steering-shorthand half)"` -- one code path, not two
      # spellings that can drift apart (01M0TJC2GY2C81Y9R1KKWT5PJJ).
      - name: python3 scripts/check-board-citations.py
        run: scripts/check-fast-gates.sh --gate "board citations (steering-shorthand half)"

  # The MSRV declared in the workspace manifest, built on that exact toolchain.
  # `rust-version` used to be set to 1.94.0 -- the same version the toolchain
  # file pins -- which is a claim nothing had ever tested, and the most
  # conservative possible one. Measured instead: 1.87 fails (`darling`,
  # `ignore` and `instability` all require 1.88), 1.88 builds the workspace and
  # compiles every test target. So 1.88.0 is what the tree genuinely supports
  # and what it now declares.
  #
  # `--no-run` for the test targets: the point here is that everything
  # COMPILES on the MSRV, not full behavioural coverage a second time --
  # `feature-matrix` below (all six combinations) and `test` above
  # (`--all-features`) already run the suite for real on the pinned
  # toolchain; this job only needs to confirm the MSRV floor itself compiles.
  msrv:
    name: cargo build (MSRV 1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      - name: cargo test --workspace --all-features --no-run
        run: cargo test --workspace --all-features --no-run

  # Licence and dependency policy, per `CONTRIBUTING.md` §6. The licence half is
  # the load-bearing one: it was shown to fail on a scratch commit adding a
  # GPL-2.0 dependency, which it rejected by name and line.
  #
  # `cargo-deny` is the one dependency admitted under §6's carve-out for tooling
  # that enforces the dependency policy itself. It is installed here rather than
  # vendored, and never linked into any conway binary.
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.20

      - name: cargo deny check
        run: cargo deny check

  # Rustdoc with warnings denied. This is not cosmetic: the run that introduced
  # it found ~75 real defects, almost all public documentation linking to a
  # PRIVATE item -- a link that silently renders as plain text for the reader
  # who needed it most, the one outside this workspace.
  #
  # `--no-deps` because a warning in somebody else's crate is not actionable
  # here. The `output filename collision` cargo warning (rust-lang/cargo#6313,
  # the `conway` bin target vs the `conway` lib target) is a cargo warning
  # rather than a rustdoc lint, so `-D warnings` does not turn it into an
  # error; it is expected output, not a failure.
  doc:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      # `scripts/check-fast-gates.sh --gate "cargo doc (-D warnings)"` sets
      # RUSTDOCFLAGS itself -- this is the exact gate two workers missed in
      # one batch on 2026-08-24 (01M0TJC2GY2C81Y9R1KKWT5PJJ); it is now the
      # same script a worker is told to run locally, not a second spelling of
      # the same command that can silently disagree with this one.
      - name: cargo doc --workspace --no-deps
        run: scripts/check-fast-gates.sh --gate "cargo doc (-D warnings)"

  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Same invocation as `scripts/check-fast-gates.sh --gate "cargo clippy
      # (-D warnings)"` -- one code path, not two spellings that can drift
      # apart (01M0TJC2GY2C81Y9R1KKWT5PJJ).
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: scripts/check-fast-gates.sh --gate "cargo clippy (-D warnings)"

  feature-matrix:
    # DECISION (board item 01M0JMEK24ZPRSP3PT3HJG0VHD): this job RUNS the
    # suite under all six combinations, it does not just compile it.
    #
    # It used to be `cargo test --no-run`: compile the test binaries so a
    # test that cannot build under a given combination fails here instead of
    # hiding (the gap the pre-`feature-matrix.yml` `cargo check`-only guard
    # had), but never execute anything. That silently hid a real defect:
    # under `--no-default-features --features builtin-tools` (and every
    # other non-default combination missing `jsonl-store`), 19 of 27 tests in
    # `crates/conway/tests/builder.rs` failed the moment they were actually
    # run -- they call `build()` and expect it to succeed, which requires a
    # `PathStore`, which without `jsonl-store` a facade-only caller has no
    # way to supply (`PathStore` is engine-internal and not re-exported --
    # board item 01M0EMCK55628YJXGBQY8YGXHE). CI had been green throughout
    # because `--no-run` never reached that failure. Those tests are gated
    # on `jsonl-store` now (stacked with `builtin-tools` where both applied)
    # -- they were never meant to run without it, not a defect in that
    # configuration -- and all six combinations pass for real, not just
    # compile.
    #
    # Dropping `--no-run` was not a judgement call against CI time: running
    # the already-compiled `conway` test binaries takes on the order of five
    # seconds per combination (measured locally: 0.00s-5.05s across all six),
    # against tens of seconds of compile time paid either way. Execution is
    # not the cost here; compiling six times is, and that cost does not
    # change.
    #
    # WHAT THIS STILL DOES NOT CATCH, stated because a gate whose blind spots
    # are unstated is the same defect one level up:
    #   * Only `-p conway` runs here. A test in another workspace crate that
    #     is only reachable through one of these six combinations (there is
    #     no reason to expect one, but nothing here rules it out) is
    #     uncovered by this job; the `test` job's `--all-features` run is the
    #     only thing exercising the rest of the workspace.
    #   * A behaviour that only breaks under a combination NOT in this matrix
    #     (e.g. `metadata-refresh` or `testkit` toggled independently) is not
    #     covered; the six entries below were chosen to cover the two
    #     genuine feature axes (`builtin-tools`, `jsonl-store`) and their
    #     absence, not every point in the full feature lattice.
    name: cargo test -p conway (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every combination reports independently. One red combination must not
      # mask the others -- when this matrix regressed in 2026-07-30's
      # `b86f5f8`, exactly two of six combinations broke, and knowing WHICH
      # two is what identified the single root cause.
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: builtin-tools-only
            args: --no-default-features --features builtin-tools
          - name: jsonl-store-only
            args: --no-default-features --features jsonl-store
          - name: builtin-tools+jsonl-store
            args: --no-default-features --features builtin-tools,jsonl-store
          - name: all-features
            args: --all-features
          - name: default
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo test -p conway
        run: cargo test -p conway ${{ matrix.args }}

  # Every job above runs `ubuntu-latest`. `conway-plugin-confine` has genuine
  # `#[cfg(target_os = "macos")]` code and tests -- Seatbelt (`sandbox-exec`)
  # containment, the security boundary `conway.confine` exists to provide --
  # that a Linux runner never compiles at all, so no job above can ever catch
  # a defect in it. This is not hypothetical: this exact defect's mirror
  # image (a `#[cfg(target_os = "linux")]` doc linking to a macOS-gated item,
  # so the link rendered clean on macOS and failed only on CI) went red on
  # this workflow and was fixed in cb0bc487, hours before this job was
  # written. Reverse the platforms -- a macOS-gated doc linking to something
  # Linux-gated -- and nothing above would ever see it. Board item
  # `01M3DJ66THS10MDKSQ3QT4YXHG`.
  #
  # SCOPE, deliberately narrower than the `test`/`feature-matrix` jobs above:
  #   * the `doc` gate, workspace-wide -- rustdoc only renders a
  #     `#[cfg(target_os = "macos")]` item's own doc comment when compiled
  #     FOR macOS, so this is the only job in this whole workflow that can
  #     ever check that half of the docs at all (`cb0bc487`'s defect ran the
  #     opposite direction from this job).
  #   * `cargo test -p conway-plugin-confine` -- the crate whose own doc
  #     (`docs/plugins/confine.md`, "Verified on") makes a containment claim
  #     about macOS. Before this job existed, NOTHING in this repository's
  #     automation ran that claim's test: the `#[cfg(target_os = "macos")]`
  #     module does not exist in a Linux build, and no other job here runs
  #     on macOS at all.
  #   * `cargo test -p conway-cli --test confine_cli` -- the one CLI-level
  #     acceptance test for the same tool, `#![cfg(target_os = "macos")]`
  #     for its entire file; scoped to this one test binary rather than
  #     `conway-cli`'s much larger full suite, which the `test` job above
  #     already runs (on Linux) for everything that is not platform-gated.
  #
  # NOT the full `--workspace --all-features` suite on macOS, and not every
  # crate: GitHub bills a private repository's macOS runners at a real
  # multiple of a Linux minute (this repository is public today, where
  # standard runners of every OS are unlimited and free, but a job's scope
  # should not assume that never changes). Scoping to the crates that
  # actually carry platform-gated, security-relevant code keeps this job's
  # cost proportionate to what only it can catch.
  #
  # NAMED RESIDUAL GAP (P-15: a check's blind spot, stated, not discovered
  # later): this job does not install `bwrap` and does not run on Linux, so
  # it does nothing for the Linux half of `conway.confine` -- that half's
  # containment test already skips itself (printing why) whenever `bwrap` is
  # absent from the machine running the suite, including on this workflow's
  # own `test` job today. The Linux containment claim stays exactly as
  # unverified-by-CI as before this job; only the macOS claim changes.
  macos:
    name: macOS (doc + confine tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      # Same invocation as `scripts/check-fast-gates.sh --gate "cargo doc
      # (-D warnings)"` -- one code path, not two spellings that can drift
      # apart (01M0TJC2GY2C81Y9R1KKWT5PJJ).
      - name: cargo doc --workspace --no-deps
        run: scripts/check-fast-gates.sh --gate "cargo doc (-D warnings)"

      - name: cargo test -p conway-plugin-confine --all-features
        run: cargo test -p conway-plugin-confine --all-features --no-fail-fast

      - name: cargo test -p conway-cli --test confine_cli --all-features
        run: cargo test -p conway-cli --test confine_cli --all-features --no-fail-fast
