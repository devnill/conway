name: CI

# Supersedes the old `feature-matrix.yml`, which ran `cargo check -p conway`
# across feature combinations and nothing else. That guard was narrower than
# its name suggested: because it never COMPILED tests, it could not catch a
# test that fails to build under a feature combination -- and two such tests
# (`conway_ask.rs` ungated, and a `plugin_surface.rs` test gated on the wrong
# feature) sat broken and invisible until
# retired the backend feature flags and exposed them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant. Cancelling it
# keeps queue depth (and Actions minutes) down, which matters because the
# feature matrix alone is six jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # First because it is the cheapest signal in the workflow: rustfmt parses and
  # reprints, it never compiles, so this reports in well under a minute while
  # the other three jobs are still building.
  #
  # The workspace was reformatted in 5bf6635 (115 files) and `rustfmt.toml`
  # pins `style_edition` so an edition bump cannot silently reformat the tree
  # and undo it. Before that, this gate would have been red on arrival, which
  # is why it did not exist.
  fmt:
    name: cargo fmt (--check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt

      # No Swatinem/rust-cache here on purpose: nothing is compiled, so there
      # is no build output worth restoring and the cache round trip would cost
      # more than the check.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  test:
    name: cargo test (workspace, all features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features --no-fail-fast

  # The falsifiable claims `scripts/board-claims.md` declares about the tree,
  # each owned by an open board item -- the completeness contract that makes
  # `PHILOSOPHY.md`'s present-tense exemption safe (`CONTRIBUTING.md` §2), and
  # nothing enforced it for a long time. The prose ledger this replaced went
  # stale on its highest-traffic entry while `docs/plugins/hooks.md`, which
  # IS gated, stayed exact. The difference was enforcement, not care.
  #
  # Pure Python over the repo, no toolchain and no build: it runs in seconds and
  # needs nothing but a checkout, which is why it sits first with `fmt`. CI has
  # no `.ideate-work/board.db` (gitignored local tooling state), so the
  # board_item cross-check this script can also do on a maintainer checkout
  # does not run here -- the predicate evaluation itself does not need it.
  design-claims:
    name: design claims (board-sourced predicates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: python3 scripts/check-design-claims.py
        run: python3 scripts/check-design-claims.py

  # The steering-shorthand half of `check-board-citations.py` -- bare `GP-*`/
  # `P-*`/`C-*` ids from `.ideate/steering/` (gitignored, unresolvable outside
  # a maintainer checkout) leaking onto a page a third party actually reads.
  # Needs no store, unlike this script's OTHER half (ULID citation
  # resolution against `.ideate-work/board.db`/`.ideate/record`), which CI
  # cannot run -- both are `.gitignore`d local tooling state, and committing
  # them was declined. The script itself prints "CITATION-RESOLUTION HALF
  # SKIPPED" and still exits 0 on a clean steering-shorthand pass, so this
  # job gates what CI genuinely can check rather than always failing on a
  # half it never had the stores for.
  board-citations:
    name: board citations (steering-shorthand half)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: python3 scripts/check-board-citations.py
        run: python3 scripts/check-board-citations.py

  # The MSRV declared in the workspace manifest, built on that exact toolchain.
  # `rust-version` used to be set to 1.94.0 -- the same version the toolchain
  # file pins -- which is a claim nothing had ever tested, and the most
  # conservative possible one. Measured instead: 1.87 fails (`darling`,
  # `ignore` and `instability` all require 1.88), 1.88 builds the workspace and
  # compiles every test target. So 1.88.0 is what the tree genuinely supports
  # and what it now declares.
  #
  # `--no-run` for the test targets, matching `feature-matrix` below: the point
  # is that everything COMPILES on the MSRV, not that the suite runs twice.
  msrv:
    name: cargo build (MSRV 1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace --all-features
        run: cargo build --workspace --all-features

      - name: cargo test --workspace --all-features --no-run
        run: cargo test --workspace --all-features --no-run

  # Licence and dependency policy, per `CONTRIBUTING.md` §6. The licence half is
  # the load-bearing one: it was shown to fail on a scratch commit adding a
  # GPL-2.0 dependency, which it rejected by name and line.
  #
  # `cargo-deny` is the one dependency admitted under §6's carve-out for tooling
  # that enforces the dependency policy itself. It is installed here rather than
  # vendored, and never linked into any conway binary.
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.20

      - name: cargo deny check
        run: cargo deny check

  # Rustdoc with warnings denied. This is not cosmetic: the run that introduced
  # it found ~75 real defects, almost all public documentation linking to a
  # PRIVATE item -- a link that silently renders as plain text for the reader
  # who needed it most, the one outside this workspace.
  #
  # `--no-deps` because a warning in somebody else's crate is not actionable
  # here. The `output filename collision` cargo warning (rust-lang/cargo#6313,
  # the `conway` bin target vs the `conway` lib target) is a cargo warning
  # rather than a rustdoc lint, so `-D warnings` does not turn it into an
  # error; it is expected output, not a failure.
  doc:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc --workspace --no-deps
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  clippy:
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  feature-matrix:
    # `cargo test --no-run` rather than `cargo check`: it compiles the test
    # binaries too, so a test that cannot build under a given feature
    # combination fails here instead of hiding. That is the gap the old
    # workflow had. It does not RUN the tests -- the `test` job above does
    # that once, with every feature on -- so the added cost is compile time
    # for test targets, not six full suite executions.
    name: cargo test --no-run -p conway (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every combination reports independently. One red combination must not
      # mask the others -- when this matrix regressed in 2026-07-30's
      # `b86f5f8`, exactly two of six combinations broke, and knowing WHICH
      # two is what identified the single root cause.
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            args: --no-default-features
          - name: builtin-tools-only
            args: --no-default-features --features builtin-tools
          - name: jsonl-store-only
            args: --no-default-features --features jsonl-store
          - name: builtin-tools+jsonl-store
            args: --no-default-features --features builtin-tools,jsonl-store
          - name: all-features
            args: --all-features
          - name: default
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --no-run -p conway
        run: cargo test --no-run -p conway ${{ matrix.args }}
