id: GP-08
type: guiding_principle
name: Isolation Belongs to Tools, Not the Harness
status: active
description: "Conway does not own sandboxing, worktree management, or file-conflict prevention. If parallel agents need isolation, the agent achieves it through tools (e.g., creating a git worktree via the bash/git tools). The harness's responsibility ends at the permission model: a basic tool-permission gate with a callback surface for the embedder (IDE) or CLI to approve/deny, refined over time in thin slices. This keeps the core small and keeps environmental policy where the caller can see and control it."
