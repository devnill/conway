id: GP-10
type: guiding_principle
name: Context Provenance Is Visible
status: active
description: For any agent in the tree, it must be inspectable what its context contains and where each part came from (forked prefix, appended prompt, parent messages, tool results). This is the primary defense against the empirically dominant multi-agent failure modes — losing conversation history, repeating work, misaligned children (MAST taxonomy, 41-87% failure rates). Session persistence, debugging output, and the IDE-facing API all expose the agent tree and per-agent context composition. A feature that makes context flow opaque is wrong even if convenient.
