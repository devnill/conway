id: GP-09
type: guiding_principle
name: Legitimate Provider Access Only
status: active
description: "Conway only implements provider access paths that are sanctioned by the provider: metered API keys everywhere, OpenAI's official 'Sign in with ChatGPT' program, Ollama Cloud API keys, GitHub Copilot's official SDK OAuth. It never implements ToS-violating paths — specifically, Claude Pro/Max subscription OAuth reuse, which Anthropic contractually prohibits and technically blocks (enforced against OpenCode, Feb 2026). Documentation states plainly why unsupported paths are unsupported, so users are not tempted to bolt them on."
