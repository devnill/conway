id: GP-02
type: guiding_principle
name: Fork and Spawn Are Distinct Primitives
status: active
description: "Forked subagents inherit the entire context of the forker plus an additional prompt (a literal, cache-friendly prefix). Non-forked (spawned) subagents are clean-slate. These are two separate concepts — never blur them into one parameterized 'partial inheritance' operation. Composite patterns (tournaments, adversarial prompting, parallel exploration) are built by composing the two: a fork creates multiple spawned children with different prompts and aggregates results to the parent. The goal is granular control over context. If a design question arises about 'inheriting some of the context', the answer is to restructure the hierarchy (GP-01), not to add a third primitive."
