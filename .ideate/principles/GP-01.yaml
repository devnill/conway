id: GP-01
type: guiding_principle
name: Lean Context Through Hierarchy
status: active
description: Context economy comes from structure, not from selective inheritance machinery. Each agent keeps its own context minimal — the top level holds only the basics of what it should be doing — and delegates detail downward, so deeper agents have highly specific, focused, lean context windows. A design that fattens any level's context 'just in case' violates this; over-inheritance is a defect on par with under-inheritance (context rot is empirically real past ~100k tokens). When deciding where information lives, push it to the most specific level that needs it.
