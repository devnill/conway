id: GP-05
type: guiding_principle
name: Library First, Three Equal Consumption Modes
status: active
description: "Every capability is reachable through the Rust library API; the interactive CLI and the stdin-style streaming one-shot mode are thin layers over it. No feature may be CLI-only or library-only. Raw inference / one-shot use is a first-class product surface (the clean replacement for hacky `claude -p` usage), not an afterthought — it gets proper streaming, exit codes, and structured output. When adding a feature, the acceptance question is: can the Tauri IDE call it, can a terminal user run it interactively, and can a script pipe to it?"
