id: GP-03
type: guiding_principle
name: Everything Is a Plugin
status: active
description: "The tool architecture has exactly one extension mechanism: the plugin API. Built-in tools (read, write, edit, bash, and the fork tool itself) are implemented as plugins on the same API third parties use — no privileged core tools, no special cases. A capability like MCP-server support is a plugin that surfaces external tools, not a core feature. When a new capability is proposed, the default question is 'what plugin API surface does this need?', not 'what core change does this need?'. This keeps the core small and makes extensibility a tested-by-default property."
