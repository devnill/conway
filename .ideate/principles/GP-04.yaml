id: GP-04
type: guiding_principle
name: Thin Testable Slices, CLI First
status: active
description: "Plan and build in thin, testable chunks. The very first goal is a working CLI plus library API so every subsequent slice can be exercised by hand during development. A slice that cannot be demonstrated through the CLI or a library test is not done. Prefer shipping a narrow vertical (e.g., one backend, one tool, one fork) over a broad horizontal layer that nothing exercises. This also governs ambiguous scope decisions: choose the smaller slice that keeps the system demonstrable."
