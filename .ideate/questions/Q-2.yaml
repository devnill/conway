domain: backends-routing
title: Cache affinity vs role-based routing (T-4)
question: Should the router ever gain a cache-affinity input (prefer the fork parent's backend+model for children), trading GP-07 predictability for prefix-cache reuse?
source: architecture T-4
impact: Forks routed to a different model than their parent always pay full prefix cost — possibly the single largest cost lever in the design; but affinity makes routing state-dependent.
status: open
reexamination_trigger: "After MVP: measure fork cache-hit rates and cross-model fork frequency in real IDE usage before deciding."
