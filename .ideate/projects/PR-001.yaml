id: PR-001
type: project
intent: "Conway is a Rust agent harness for agentic coding, consumed three ways: an embeddable library (primary consumer: the user's Tauri-based agentic IDE), an interactive CLI, and a stdin-style streaming one-shot mode (a clean replacement for `claude -p`-style raw inference). Its differentiator is first-class hierarchical forking: fork (child inherits the forker's entire, deliberately lean context plus a prompt) and spawn (clean-slate child) as distinct primitives, with bidirectional message-based parent-child communication. Provider routing across local backends (Ollama, llama.cpp, etc.) and cloud providers (Anthropic API, OpenAI, Ollama Cloud) is a core harness responsibility, built on capability-flagged native adapters that exploit each backend's prompt-caching mechanism."
scope_boundary:
  in:
    - Fork and spawn subagent primitives with bidirectional parent-child messaging
    - Plugin API for tools; minimal built-in tool set implemented as plugins
    - System-prompt control (agent/skill definitions)
    - "Provider routing: declarative per-role model aliases, fallback chains, health/failover layer, configurable reasoning headroom"
    - "Backend adapters: Anthropic (native, API key) and OpenAI-compatible (covers Ollama local/cloud, llama.cpp, LM Studio, vLLM)"
    - Library API (Rust), interactive CLI, and stdin-streaming one-shot mode
    - Session persistence sufficient for fork/resume
    - Basic permission model via callback to the embedder/CLI
  out:
    - Sibling branch comparison/selection/merge primitives (tournaments, judges) — caller-side in v1
    - Harness-owned isolation/sandboxing/worktrees — isolation is done by agents via tools
    - Classifier-based auto-routing — declarative only in v1
    - ACP protocol adapter — deferred post-MVP
    - Claude subscription OAuth — contractually prohibited and technically blocked by Anthropic
    - llama.cpp native slot-caching adapter — fast-follow, not MVP
    - TypeScript client SDK — later, once core API stabilizes
    - Context compaction/curation — intentionally deferred; oversized requests are rejected via the headroom-aware gate
success_criteria:
  - Conway drives a real coding task end-to-end from the Tauri IDE via the Rust library API
  - The CLI supports interactive sessions and clean one-shot stdin/stdout raw inference with streaming
  - A parent agent can fork (full lean-context inheritance) and spawn (clean slate) children, exchange messages bidirectionally, and aggregate results
  - Requests route across at least Anthropic and one OpenAI-compatible local backend via role aliases with failover
  - Third-party tools can be added through the plugin API without touching core code
  - Every development increment is a thin, testable slice exercisable through the CLI
appetite: 6
steering: "Build order matters: the CLI app and library API come first so every subsequent slice is testable during development. All three consumption modes (library, CLI, stdin-streaming) are first-class from the start. Prompt-cache reuse is an economic optimization, never correctness-bearing. Context-window gating reserves configurable headroom for reasoning/output tokens; requests that cannot fit are rejected, never truncated."
