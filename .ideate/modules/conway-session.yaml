id: conway-session
type: module_spec
module: conway-session
cycle_created: 0
scope: "Persistence: JsonlSessionStore implementation, log record serialization, ancestry resolution, fork-by-reference, resume, session index. NOT responsible for: deciding what to persist (runtime), context assembly, in-memory agent state."
provides:
  - "JsonlSessionStore::open(root) -> impl SessionStore; one append-only .jsonl per session under .conway/sessions/, first line is the header carrying origin: {parent, at_seq, mode} for forks"
  - "TranscriptResolver::resolve(store, sid) -> Arc<[LogRecord]>: walks ancestry chain, applies at_seq truncation, memoized per (sid, at_seq) in bounded LRU so N siblings forked at one point share one allocation"
  - "SessionIndex: derived, rebuildable by scanning headers; accelerates list/children/tree reconstruction"
  - "SessionMeta{id, agent_id, origin: Option<ForkOrigin>, agent_def, role, created, cwd, labels, status}; ForkOrigin{parent, at_seq, mode}"
  - "provenance::ContextReport{segments: Vec<(SegmentId, Provenance, tokens_est)>} persisted alongside each turn so provenance survives restart"
requires: "conway-core: SessionStore, LogRecord, SessionMeta, Provenance, StoreError."
boundary_rules:
  - Append-only; no record mutated or deleted in place; compaction (if ever) writes a new file
  - fork() MUST NOT copy records - one header line, O(1) in parent transcript size
  - "One file per session: no cross-session write contention, N siblings write N distinct files lock-free"
  - "Persist-before-act: every append durable before the corresponding side effect is externally visible; fsync policy configurable (always|interval|never), default interval(200ms) with always for headers and AgentResult records"
  - Partially-written trailing line tolerated on read (truncate-and-warn), never a hard failure
  - Store MUST NOT interpret record semantics beyond kind and seq
internal_notes: "JSONL over SQLite deliberately: human inspection with jq/grep, one-file-per-session concurrency, O(1) fork, diffable bug reports for OSS. The SessionStore trait is the seam; SQLite is a drop-in later if list over 10k sessions hurts. Fork immutability invariant: records below at_seq are frozen from the child's perspective; parent appends at seq >= at_seq are invisible to the child."
