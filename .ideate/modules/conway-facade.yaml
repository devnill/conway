id: conway-facade
type: module_spec
module: conway (facade crate)
cycle_created: 0
scope: "The public library API and runtime assembly: config discovery/parsing/merging, agent & skill definition loading, backend construction from config, default plugin registration, and the SessionHandle surface the Tauri IDE consumes. NOT responsible for: any agent logic - wiring plus ergonomics only."
provides:
  - "ConwayBuilder: from_config(path), discover() (cwd -> .conway/ -> XDG -> env), with_backend/with_plugin/with_permission_gate/with_session_store/with_router, build() -> Conway"
  - "Conway: new_session(SessionSpec) -> SessionHandle, resume(sid), sessions(filter), explain_routing(role)"
  - "SessionHandle: id, root, prompt(text) -> TurnHandle, events() -> EventStream (from-now or from-seq), fork(from, ForkSpec) -> AgentId, spawn(from, SpawnSpec) -> AgentId, steer(target, text), await_agent(target) -> AgentResult, cancel(target, reason), tree(), context_report(agent), transcript(agent)"
  - "config::{ConwayConfig, load, merge}: precedence CLI flags > env CONWAY_* > ./.conway/conway.toml > $XDG_CONFIG_HOME/conway/conway.toml > defaults"
  - "agents::load_agent_defs: markdown + YAML frontmatter from .conway/agents/*.md; frontmatter: name, role, tools, model, max_steps, result_contract; body is the system prompt"
  - gates::{AllowListGate, DenyAllGate, PromptingGate}; presets::builtin_plugins
requires: conway-runtime, conway-core, conway-backends (feature-gated), conway-session, conway-routing, conway-tools.
boundary_rules:
  - Defines the ONLY stable public API; conway-runtime internals not re-exported
  - Every capability reachable from the CLI MUST be reachable here first (C-03, GP-05); a CLI-only feature is a bug
  - Config loading MUST NOT require network access; model metadata is a local file with an optional explicitly-invoked refresh (models.dev is convenience, not dependency)
  - MUST reject Anthropic OAuth tokens (sk-ant-oat*) at config parse time with an explanatory error naming the reason (C-02, GP-09)
  - "Feature flags: default = [anthropic, openai-compat, builtin-tools, jsonl-store]; each backend independently disableable for minimal embedder binaries"
internal_notes: Agent definitions use markdown-with-frontmatter matching what Claude Code/OpenCode users already know. SessionHandle wraps Arc<Runtime>; TurnHandle resolves when the root agent's turn chain completes.
