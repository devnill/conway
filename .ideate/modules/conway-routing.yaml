id: conway-routing
type: module_spec
module: conway-routing
cycle_created: 0
scope: "Two cleanly separated concerns: (a) DeclarativeRouter - resolves a RoleAlias to an ordered candidate list from static config; (b) BreakerRegistry - per-endpoint circuit breakers and health probing. NOT responsible for: making backend calls, classifying prompts, content inspection, cost-based selection."
provides:
  - DeclarativeRouter::new(RoutingConfig, Arc<dyn HealthRegistry>, CapabilityIndex) -> impl Router
  - "BreakerRegistry::new(HealthConfig) -> Arc<dyn HealthRegistry>: two independent breakers per endpoint (Transport, Probe), configurable threshold/open-duration/half-open"
  - "HealthProber::spawn(backends, HealthConfig) -> ProberHandle: periodic Backend::probe"
  - "CapabilityIndex: (backend, model) -> Capabilities, built at startup, consulted for RequiredCaps filtering"
  - "RoutingExplain::explain(&RouteRequest) -> ExplainReport: the 'why did this model run' answer including skipped candidates"
requires: "conway-core: Router, HealthRegistry, RouteRequest, Route, RoutingReason, RoutingConfig, Capabilities."
boundary_rules:
  - resolve() MUST be pure w.r.t. request content; RouteRequest has no prompt-text field by construction (compile-time guarantee)
  - resolve() MUST be synchronous and allocation-cheap (called every turn of every agent)
  - MUST return RoutingReason for chosen route AND every skipped candidate; Err(NoCandidate) enumerates every rejection
  - Router MUST NOT mutate breaker state; only the runtime records observations after attempts
  - Breakers distinguish transport failures from probe failures (Olla pattern)
  - No classifier, embedding model, or learned component may be linked into this crate
internal_notes: "Config: [roles.<alias>] chain = ['backend/model', ...] plus [health] transport_failures_to_open, open_duration, probe_interval, probe_timeout. Fallback exercised by the runtime looping over resolve() output; failover-worthy errors: Transport, ServerError, RateLimit. ContextOverflow/BadRequest are RequestIncompatible (T-2): advance the chain WITHOUT recording a health observation."
