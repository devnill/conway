id: conway-backends
type: module_spec
module: conway-backends
cycle_created: 0
scope: "Concrete Backend implementations: AnthropicBackend (native Messages API, API key only) and OpenAiCompatBackend (one adapter, five dialects: OpenAi | Ollama | VllmHermes | LmStudio | LlamaCppServer - covers Ollama local+cloud, llama.cpp server, LM Studio, vLLM, OpenAI). Owns wire-format translation, tool-call parsing (streaming and non-streaming), cache-hint mapping, capability declaration. NOT responsible for: backend selection (routing), cross-backend retry (runtime), breaker state (routing), the agent loop."
provides:
  - AnthropicBackend::new(AnthropicConfig) -> impl Backend (feature anthropic)
  - OpenAiCompatBackend::new(OpenAiCompatConfig) -> impl Backend (feature openai-compat), dialect field selects ToolCallAccumulator + quirk workarounds
  - "CapabilityProbe: startup capability discovery (/v1/models, /props, metadata file) producing Capabilities per model"
  - "ToolCallAccumulator: backend-specific streamed-delta accumulation with validation, exposed for testing"
  - "ModelMetadata loader: local file, optionally models.dev-derived, never a hard network dependency"
requires: "conway-core: Backend, GenerateRequest/Response, StreamChunk, Capabilities, CacheHint, BackendError."
boundary_rules:
  - Capabilities declared per (backend, model), never per backend alone - tool-call correctness varies by model+template+quantization
  - Cache hints MAY be dropped but request content bytes MUST be unchanged; ExplicitBreakpoints maps breakpoint:true segments to cache_control ephemeral markers capped at max_breakpoints (drop earliest-value first); ImplicitPrefix is a wire no-op (ordering does the work); SlotKv uses prefix_key as slot key (post-MVP)
  - MUST NOT retry across backends; transport-level retry (connection reset, 429 with Retry-After) at most twice with jitter; all else surfaces as BackendError
  - MUST classify errors into BackendError variants - health layer distinguishes Transport/ServerError (breaker-tripping) from BadRequest/Auth (not)
  - MUST NOT implement Anthropic subscription OAuth; sk-ant-oat* tokens rejected at config-parse time with explanatory error (C-02, GP-09)
  - Trait must accommodate future llama.cpp slot adapter without signature change (prefix_key + CacheMode::SlotKv already reserved)
internal_notes: "Streaming tool-call parse is the known-buggy path (Ollama #12557, vLLM hermes #31871, LM Studio-adjacent #7517). Accumulator validates on finish_reason; failure returns BackendError::ToolParse and the runtime falls back to non-streaming. Per-model config stream_tools=false skips the streaming attempt entirely; default derived from ReliabilityTier (T-3 resolution)."
