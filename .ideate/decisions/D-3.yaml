domain: agent-hierarchy
title: Headroom-gated rejection instead of compaction (T-1)
decision: Requests are gated by est_tokens + configurable headroom (output/reasoning reservation) against each candidate's context window; no fit means a typed rejection. Compaction/context curation is deferred from v1. Headroom also serves as the default max_tokens.
rationale: "User decision: predictable failure over silent truncation or cost-surprising escalation; keeps the literal-prefix fork invariant intact."
source: interview T-1 answer + mid-planning headroom requirement (2026-07-20)
