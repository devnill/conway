id: D-1
type: domain_decision
domain: agent-hierarchy
title: Fork and spawn are the only subagent primitives
decision: Forked subagents inherit the forker's entire context plus a directive; spawned subagents are clean-slate; parallel patterns compose (a fork creates N spawns and aggregates).
rationale: Granular context control comes from hierarchy structure (lean parents), not selective-inheritance machinery; matches caching economics (literal prefixes) and avoids a combinatorial API.
