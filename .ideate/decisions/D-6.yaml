id: D-6
type: domain_decision
domain: backends-routing
title: Streaming tool-calls gated by reliability tier
decision: Per-model stream_tools defaults derive from ReliabilityTier (Verified streams; Community/Unknown use non-streaming tool turns); a streamed ToolParse failure triggers exactly one non-streaming retry on the same route; text-only turns always stream.
rationale: "Streaming + tool-calls is actively buggy across local backends in 2026 (Ollama #12557, vLLM #31871, LM Studio-adjacent #7517); the caller-facing stream contract stays identical either way."
source: research-local-backends; architecture T-3
