id: D-10
type: domain_decision
domain: agent-hierarchy
title: Cache breakpoints at segment-order boundaries; PrefixKey identity
decision: ContextBuilder emits a fixed segment order (SystemPrompt, Skills, ToolSchemas [breakpoint A], InheritedPrefix [breakpoint B], directive, volatile); PrefixKey = blake3(model_id + canonical prefix through B), stable across same-point siblings; TTL is config-owned (global + per-role), no adaptive heuristics.
rationale: The fixed ordering IS the caching mechanism on implicit-prefix backends; breakpoints at A/B map to Anthropic cache_control and reserve the llama.cpp slot key; predictability per GP-07 (architecture T-6).
source: architecture §5.3, T-6
