id: D-4
type: domain_decision
domain: backends-routing
title: Capability-flagged native adapters, not an OpenAI-compatible LCD
decision: "Two MVP adapters: Anthropic native and one OpenAiCompat adapter with five dialects (OpenAi, Ollama, VllmHermes, LmStudio, LlamaCppServer); capabilities declared per (backend, model); cache modes modeled as ExplicitBreakpoints | ImplicitPrefix | SlotKv | None with the SlotKv seam reserved for a post-MVP llama.cpp slot adapter."
rationale: Research showed an LCD interface silently drops the one feature (addressable cache reuse) the fork design depends on, and tool-call fidelity varies by model+template+quantization, not backend alone.
