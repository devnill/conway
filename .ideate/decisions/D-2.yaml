id: D-2
type: domain_decision
domain: agent-hierarchy
title: Turn-boundary message steering, not mid-generation interruption
decision: Parent-child communication is message-based (Steer/Cancel/Progress/Result) over bounded mailboxes; steers land only at turn boundaries; hard-cancel is the escape hatch.
rationale: Claude Code-style semantics the user asked for; real-time steering is unsolved industry-wide (open Claude Code issues); SteerQueued events make the latency visible instead of hidden.
assumes: Turn-boundary latency is acceptable when surfaced to the IDE.
