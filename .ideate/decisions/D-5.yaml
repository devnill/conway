id: D-5
type: domain_decision
domain: backends-routing
title: Declarative role-chain routing with Olla-style dual breakers
decision: Role aliases resolve to ordered backend/model chains from TOML; health is two independent circuit breakers per endpoint (Transport, Probe); RequestIncompatible failures (ContextOverflow/BadRequest) advance the chain without recording health (T-2); no classifiers ever link into conway-routing.
rationale: Predictability ('which model ran this and why' always answerable) plus correct separation of routing policy from endpoint health; crash-prone local servers need probe-based liveness distinct from transport errors.
source: research-routing; architecture T-2
