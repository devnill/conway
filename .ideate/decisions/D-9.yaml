id: D-9
type: domain_decision
domain: plugins-tools
title: In-process plugins with subprocess-representable types
decision: MVP plugins are in-process Arc<dyn Plugin>, but all tool-facing types (ToolCall, ToolOutput, specs) are fully JSON-serializable so a subprocess or WASM plugin host remains retrofittable; ToolCtx::subagents (Arc<dyn SubagentHost>) is the known non-serializable exception needing an RPC form later.
rationale: Rust has no stable ABI; shaping the types now is cheap, retrofitting later is expensive (architecture T-8). MCP-as-a-plugin is the stated path for external tool servers.
source: architecture T-8
