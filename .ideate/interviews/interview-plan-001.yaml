id: interview-plan-001
type: interview
cycle_created: 0
phase: plan
date: 2026-07-20
context: "Plan-mode init for conway, a new project in an empty directory. User arrived with a clear concept: an agent harness for agentic coding with pluggable model backends and a first-class forking concept. Four background research tracks ran concurrently with the interview (local/cloud backends, subagent prior art, ACP protocol, provider routing/subscription auth)."
entries:
  - id: IQ-plan-001-001
    question: What do you want to build?
    answer: An agent harness for agentic coding with a pluggable backend for local and cloud hosted models, subagents, and an emphasis on forking.
    domain: null
    seq: 1
  - id: IQ-plan-001-002
    question: What does forking mean here — what are its semantics and what happens after a fork?
    answer: "Existing coding agents act like chat clients resending full context; subagents are clean slates with minimal upward communication. Conway should make forking first-class: a hierarchy of agents where the top level has minimal state covering the basics of what it should do, delegating tasks downward. Subagents get that base context plus increasing specificity. They communicate upwards, parents pass context down. The emphasis: deeper subagents have highly specific, lean, focused context windows for efficiency."
    domain: agent-hierarchy
    seq: 2
  - id: IQ-plan-001-003
    question: What form does the harness take — library, CLI, or both?
    answer: "Both. The user has an agentic-focused IDE (Tauri app) that will embed conway. Also a CLI mode, plus rich integration for other tools: `claude -p` is useful for oneshotting but hacky for raw inference — conway should do this cleanly."
    domain: api-surface
    seq: 3
  - id: IQ-plan-001-004
    question: "Fork inheritance model: literal prefix, curated briefing, or hybrid — or pluggable?"
    answer: Strategy depends on use case; to be discussed. As a framework-focused tool, conway must surface forking in a meaningful way so tools can decide when to break work up.
    domain: agent-hierarchy
    seq: 4
  - id: IQ-plan-001-005
    question: What is the IDE written in, and does that dictate conway's language? What providers must be supported?
    answer: IDE is a Tauri app, but pick the best tool for the job. Must support local models and cloud subscriptions (Ollama Cloud, Claude, etc.) — routing requests to specific inference providers is part of the harness's job. Requested research on routing prior art and on acpserver.org for possible overlap.
    domain: backends-routing
    seq: 5
  - id: IQ-plan-001-006
    question: "Language choice: Rust core, TypeScript, or Rust core + TS SDK later?"
    answer: "Rust core (recommended option accepted): embeds in-process in the Tauri backend, single-binary CLI, official ACP Rust SDK exists if needed, strong concurrency for the routing layer."
    domain: api-surface
    seq: 6
  - id: IQ-plan-001-007
    question: Who initiates forks — developer API, the parent agent via a fork tool, or both?
    answer: "Both, API-first: the developer API is the primitive; agents get an optional fork tool built on it."
    domain: agent-hierarchy
    seq: 7
  - id: IQ-plan-001-008
    question: Should v1 include first-class sibling comparison/selection/merging (tournaments, judges)?
    answer: "No — caller-side. Key refinement: forked and non-forked subagents are separate concepts. Forked subagents inherit the entire context of the forker plus an additional prompt. Non-forked (spawned) subagents are clean-slate. Parallel patterns (tournaments, adversarial prompting) compose: a fork creates multiple non-forked subagents with different prompts, aggregated to the parent for review. The goal is granular control over context, not just inheriting everything seen so far."
    domain: agent-hierarchy
    seq: 8
  - id: IQ-plan-001-009
    question: Does conway ship built-in tools, or is it purely a harness where callers register tools? Is MCP client support in v1?
    answer: Minimal built-in tool set to start, with a plugin API to extend. Architecture around tools should be 'everything is a plugin' for easy extensibility — built-ins use the same plugin API. (MCP client support therefore becomes a plugin, not core.)
    domain: plugins-tools
    seq: 9
  - id: IQ-plan-001-010
    question: What does upward communication concretely need to be in v1 — final result only, streamed progress events, or full bidirectional steering?
    answer: Parents have direct bidirectional communication with children, similar to how subagents work in Claude Code — message-based steering and reporting, not mid-generation interruption.
    domain: agent-hierarchy
    seq: 10
  - id: IQ-plan-001-011
    question: Who approves dangerous tool calls, and are worktrees/file isolation in scope for v1?
    answer: "Permissions TBD in detail: a basic permission model for tools now, refined in thin slices. Isolation should be done by the tools — if worktrees are needed, the agent creates them by calling git via tools; not a harness primitive."
    domain: plugins-tools
    seq: 11
  - id: IQ-plan-001-012
    question: What is the MVP bar, and is conway public or personal?
    answer: "MVP: forked and non-forked subagents, basic tools, control over system prompts for things like skills/agents, routing — the gist of what was discussed. Intended to be OSS, but a private GitHub repo for now."
    domain: null
    seq: 12
  - id: IQ-plan-001-013
    question: Interview summary confirmation and open-question disposition.
    answer: "Confirmed correct, with process guidance: plan in thin, testable chunks. The very first goal is the CLI app (for testing during development) plus the API. All three consumption modes matter: library, CLI tool, and claude -p-style stdin streaming use."
    domain: null
    seq: 13
