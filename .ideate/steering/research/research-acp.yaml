id: research-acp
type: research
topic: acpserver.org and the Agent Client Protocol (ACP) — overlap with conway
date: 2026-07-20
cycle_created: 0
summary: "acpserver.org itself could not be verified (HTTP 403 on all fetches; not linked from any authoritative ACP source — possibly an SEO/unofficial site; note acpservers.org plural is an unrelated Agentic Commerce Protocol site). The real project is the Agent Client Protocol (agentclientprotocol.com, created by Zed Aug 2025, now community-governed, Apache 2.0, JSON-RPC 2.0 over stdio). ACP standardizes editor↔agent communication: session lifecycle, streaming session/update, permissioned categorized tool calls, editor-provided fs/terminal primitives. It has NO shipped concept of subagents, hierarchical context inheritance, or provider/model routing; session forking exists only as an unmerged draft RFD (flat clone-history-into-new-session, subagents listed as speculative). Verdict: ACP does not overlap conway's core (backends, routing, forking) — it is a potential presentation layer. The superset pattern (native API as source of truth + optional ACP server shim for editor reach) is architecturally sound for base interactions but cannot faithfully express conway's hierarchy today."
key_findings:
  - "ACP transport: JSON-RPC 2.0 over stdio; HTTP/WebSocket remote transport explicitly work-in-progress"
  - "Session lifecycle: initialize → session/new → session/prompt → streaming session/update; session/load replays history; client is the permission gatekeeper via session/request_permission"
  - "SDKs: TypeScript, Rust, Python, Kotlin, Java (official); adopted by Zed, JetBrains (partnership), Neovim/Emacs plugins; agents: Gemini CLI, Claude Code adapter, Copilot CLI, Codex, OpenCode, Goose, others — adoption real but conformance uneven"
  - "session/fork is a DRAFT RFD only: flat clone of history, no hierarchy, no prefix composition, no parent↔child channel — materially thinner than conway's design"
  - No provider/model routing concept at protocol level — agent is an opaque process
  - MCP (tools), A2A (agent↔agent), AG-UI (agent↔UI), ACP (editor↔agent) are complementary layers
  - "Recommendation: keep conway's native API primary; optionally ship an ACP server adapter later for Zed/JetBrains/Neovim reach; do not build core semantics against the draft fork RFD"
