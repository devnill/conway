id: research-local-backends
type: research
topic: Local and cloud LLM serving backends for a pluggable agent harness
date: 2026-07-20
cycle_created: 0
summary: "Five local backends viable (Ollama, llama.cpp llama-server, vLLM, LM Studio, MLX) all exposing OpenAI-compatible /v1/chat/completions, plus native cloud APIs (Anthropic, OpenAI). Tool-calling fidelity varies by model+quantization+template combo, not backend alone. Prompt-caching semantics differ fundamentally: Anthropic explicit cache_control breakpoints; OpenAI automatic; llama.cpp slot save/restore (strongest local, only via native API); vLLM automatic prefix caching with no pinning. Streaming+tool-calls is actively buggy across local backends in 2026. Recommendation: native per-backend adapters with a capability-flag superset interface (Option 2), not an OpenAI-compatible lowest-common-denominator, because explicit cache/prefix-reuse hints are essential to the parent-prefix-inheritance design. Abstraction layers (LiteLLM/OpenRouter) do not pass through cache-control or slot APIs."
key_findings:
  - llama.cpp native /slots save|restore is the only local mechanism for addressable KV-cache reuse — not reachable via its OpenAI-compatible layer
  - Anthropic cache_control is the only cloud API with explicit addressable cache pinning; default TTL reportedly dropped 1h→5min (Mar 2026, unconfirmed)
  - vLLM APC is implicit and evictable — byte-identical prefix ordering required, no protection under memory pressure
  - Tool-call correctness degrades sharply below Q4 quantization and with aggressive KV-cache quantization; broken GGUF chat templates are an independent failure source
  - Streaming tool-call deltas are buggy in Ollama (#12557), vLLM hermes parser (#31871), LM Studio-adjacent clients (#7517) — non-streaming tool parsing is the reliable fallback
  - "Strong open-weight agentic coding models mid-2026: GLM-5.2, Kimi K2.6, DeepSeek V4 Pro, Qwen3-Coder (80B-A3B fits a workstation)"
  - "Backend interface must cover: tool-schema translation per model+backend pair, capability flags, first-class optional cache/prefix-reuse hint mapping to each backend's mechanism, separate streaming/non-streaming tool parsing paths, quantization-aware reliability tiers"
full_report_path: scratchpad research-backends.md (session)
full_report: See key_findings; full text preserved in session scratchpad and integrated into architecture inputs.
