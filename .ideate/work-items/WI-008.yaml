  - "`cargo test -p conway-core --features fakes` passes; no-features test run also passes with conformance tests cfg-gated [machine]"
  - "`ScriptedBackend::new(Vec<ScriptedTurn>)` returns responses in order and `BackendError::BadRequest` when exhausted; asserted [machine]"
  - "`ScriptedBackend::stream` emits the same content as `generate` as `TextDelta` chunks plus exactly one `Done`; concatenated deltas equal the generate text [machine]"
  - "`FakeStore` implements the full `SessionStore` trait in memory; a test asserts `fork` copies zero records and the child's `meta().origin` is correct [machine]"
  - "`FakeGate::new(PermissionDecision)` returns a fixed decision and `FakeGate::recording()` captures every request preserving `agent_path` [machine]"
  - "`CollectingEventSink::events()` returns emitted events in order [machine]"
  - A test asserts `strip_cache_hints` leaves content and provenance of every segment byte-identical [machine]
  - "Per the headroom amendment, `FakeRouter`/capability fakes exercise the headroom gate: a scripted candidate failing `est + headroom <= max_context` is skippable in tests [machine]"
  - "`cargo clippy -p conway-core --all-features -- -D warnings` is clean [machine]"
