criteria:
  - '`fakes.rs` is gated by `#[cfg(feature = "fakes")]` and exports `FakeBackend`, `ScriptedBackend`, `FakeStore`, `FakeGate`, `FakeRouter`, `FakeHealth`, `FakeSubagentHost`, `CollectingEventSink` [machine]'
