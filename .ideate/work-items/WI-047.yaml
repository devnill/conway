criteria:
  - "`open(root)` creates root recursively; opening an existing root modifies no session file (byte-compare) [machine]"
  - "`create(meta)` writes root/<id>.jsonl with exactly the header line; `head()` returns LogSeq(0) [machine]"
  - "`create` on an existing file returns `AlreadyExists` [machine]"
  - "`append` assigns strictly sequential seqs from 0; N appends yield N+1 lines in order [machine]"
  - "`read` honors Full and sub-ranges, excludes the header, and returns available subsets beyond head without error [machine]"
  - "`meta(sid)` parses line 0; missing file returns NotFound [machine]"
  - "Recovery: truncated trailing line is repaired (set_len to last complete line) with a WARN containing `truncated trailing line`, no error; incomplete HEADER returns Corrupt without truncation; post-recovery append continues at last_complete_seq + 1 [machine]"
  - "Fsync: Always = one fsync per append; Never = zero; Interval(200ms) still fsyncs headers and agent_result records immediately [machine]"
  - "Concurrency: 10 sessions x concurrent appends use distinct per-session handles; 100 concurrent appends to one session produce seqs 0..100 with no duplicates or partial lines [machine]"
  - "Append-only invariant: file byte prefix always equals previous contents after any append sequence [machine]"
