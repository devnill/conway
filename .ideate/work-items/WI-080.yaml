criteria:
  - "`AttemptEngine::execute(AttemptRequest) -> Result<AttemptOutcome, RuntimeError>` takes an ordered Vec<Route> plus assembled segments [machine]"
  - "Strategy table: validated streaming + tools → stream(); unvalidated/NonStreamingOnly + tools → generate(); no tools → stream() [machine]"
  - generate() path still emits at least one TextDelta with the full text — caller-facing stream contract identical [machine]
  - ToolParse on a streamed attempt triggers exactly one non-streaming retry of the identical request on the SAME route; second ToolParse advances the chain [machine]
  - ModelDecision emitted before every backend call including fallbacks and the retry; attempt increments monotonically from 0 [machine]
  - "Health: Transport/ServerError/RateLimit record their observations; success records Ok{latency} [machine]"
  - "T-2: ContextOverflow/BadRequest/Auth produce zero health records; the first two advance the chain, Auth aborts [machine]"
  - Closed-to-Open breaker transition emits exactly one BackendDegraded; further failures while Open emit none [machine]
  - "T-1 headroom gate: candidate admissible iff est_tokens + headroom <= max_context_tokens; with est=30000, headroom=4000, windows [32768, 32000], both rejected and execute returns ContextTooLarge{input_tokens, headroom, required, largest_candidate, largest_window, shortfall} without calling any backend — no truncation, no escalation [machine]"
  - "Boundary: est + headroom == max is admissible; +1 is rejected [machine]"
  - "Mixed candidates [32768, 200000]: 32k skipped by the gate (no health record, appears in AttemptOutcome::skipped with CapabilitySkip), 200k attempted with ModelDecision emitted for it only [machine]"
  - ContextTooLarge Display names input tokens, headroom, required total, largest window, and model ref (five substrings asserted) [machine]
  - GenerateRequest.params.max_tokens defaults to the resolved headroom when no override; an explicit override passes through unclamped (gate arithmetic still uses headroom) — captured on ScriptedBackend [machine]
  - Exhausting all routes returns NoCandidate enumerating every route and terminal failure [machine]
