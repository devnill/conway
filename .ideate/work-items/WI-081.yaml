criteria:
  - "`AgentLoop::run(self) -> AgentResult` is infallible in return type — every failure path produces a non-Completed AgentResult [machine]"
  - "E2E vs ScriptedBackend: text-only script yields one turn with TurnStarted, TextDelta, TurnFinished, AgentFinished, Completed [machine]"
  - "E2E: [tool_call read, then text] yields two turns; tool result appended with Provenance::ToolResult and present in turn 2's context [machine]"
  - "Persist-before-act: assistant append completes before any tool invoke; UserTurn append before first backend call (FakeStore call order) [machine]"
  - "Budget: max_steps, deadline, and max_tokens each produce BudgetExceeded [machine]"
  - Denied tool call appends an error ToolResult and the loop continues (feedback, not abort) [machine]
  - "NoCandidate from the attempt engine yields Failed plus one Event::Error{fatal: true} [machine]"
  - "Within-turn event order: TurnStarted < ModelDecision < TextDelta* < TurnFinished < ToolCallProposed* [machine]"
  - CancellationToken mid-tool-batch yields Cancelled within 100ms [machine]
  - "Headroom propagation: loop resolves headroom = policy.resolve(role) and builds RouteRequest with est_tokens from the ContextReport and required.min_context = est_tokens + headroom; per-role override reflected, else global default (captured on fake Router) [machine]"
  - "Consistency: RouteRequest.required.min_context == AttemptRequest.est_tokens + AttemptRequest.headroom in a single driven turn — router filter and engine gate can never disagree [machine]"
  - ContextTooLarge from the engine terminates the loop with Failed naming input tokens, headroom, and largest window; one fatal Error event; no retry, no truncation, no additional turn [machine]
