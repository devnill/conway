criteria:
  - "`BreakerRegistry::new(HealthConfig)` and `with_clock(...)` exist; implements `conway_core::HealthRegistry` [machine]"
  - "`kind_state(&EndpointId, BreakerKind)` exposes each breaker independently; `state()` merges (later `until` wins when both open; HalfOpen next; else Closed) [machine]"
  - Unknown EndpointId returns Closed without inserting an entry [machine]
  - Transport breaker opens after `transport_failures_to_open` consecutive TransportError/ServerError; at n-1 still Closed [machine]
  - Probe breaker opens after `probe_failures_to_open` consecutive ProbeFail; breakers are fully independent in both directions [machine]
  - "`Ok{latency}` resets consecutive-failure counters on BOTH breakers and counts as a half-open success on both [machine]"
  - "`RateLimited{retry_after}` opens the Transport breaker until now+retry_after (fallback open_duration) without incrementing the failure counter; Probe untouched [machine]"
  - "With a TestClock: Open reports HalfOpen at now >= until with no record call; `state()` mutates nothing (1000-call generation-counter test) [machine]"
  - "HalfOpen: `half_open_successes_to_close` Oks close it with counters reset; one failure reopens with fixed duration (no exponential backoff) [machine]"
  - "Concurrency: 64 tasks x 100 observations on one endpoint completes without panic with deterministic terminal state [machine]"
  - "`record`/`state` take `&self`; registry is Send + Sync (static assertion) [machine]"
  - "`snapshot()` returns entries sorted by (EndpointId, BreakerKind) [machine]"
  - "`cargo test -p conway-routing` passes [machine]"
