  - "Sibling sharing: 3 same-point forks share one Arc allocation (ptr_eq) and produce the same PrefixKey [machine]"
  - "Every child has a budget by construction: start rejects a spec with neither max_steps nor deadline [machine]"
  - "await_result: unknown agent AgentNotFound; finished agent returns its recorded result immediately [machine]"
  - ToolCtx::subagents IS the Runtime (Arc<dyn SubagentHost>); no other privileged fork/spawn path exists [machine]
