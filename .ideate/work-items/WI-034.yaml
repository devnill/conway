criteria:
  - "`DeclarativeRouter::new(RoutingConfig, HeadroomPolicy, Arc<dyn HealthRegistry>, CapabilityIndex) -> Result<_, Vec<ConfigIssue>>` — HeadroomPolicy is the second parameter; per-role effective headroom resolved ONCE into the compiled chain table [machine]"
  - "`impl Router` with synchronous `resolve` — no .await, no spawn, no I/O [machine]"
  - router.rs contains no reference to prompt text (rg guard outside comments) — GP-07 [machine]
  - "Pin path: `req.pin = Some(ref)` returns length-1 vec with `PinnedByApi` when the pin passes filters; failing pin returns `Err(NoCandidate)` with the pin's skip reason [machine]"
  - "Filter order: capability filter runs before health filter — a doubly-failing candidate records CapabilitySkip [machine]"
  - Chain order preserved; reason[0] is AliasPrimary, later entries `Fallback{position}` where position is the chain index, not survivor index [machine]
  - "Health filter: Transport-open skipped with HealthSkip{Transport}; Probe-open with Probe; both-open records Transport; HalfOpen and Closed retained [machine]"
  - "T-1 (amended): when no candidate satisfies est_tokens + headroom <= max_context, resolve returns `Err(NoCandidate)` — no truncation, no headroom relaxation, no smaller-model fallback; `considered` lists every entry with its shortfall string naming the headroom reservation [machine]"
  - Headroom skip carries `CapabilitySkip` with the exact shortfall string — named test `headroom_skip_reports_capability_skip_with_shortfall` [machine]
  - "Headroom changes the outcome: same fixture resolves with headroom=0 and returns NoCandidate with headroom=16000 [machine]"
  - "Per-role override honored end-to-end: planner (16384) rejected while fast (4096 default) selected against the same candidate and est_tokens [machine]"
  - A pinned request uses the headroom of req.role (pin overrides the chain, not the policy) [machine]
  - "`resolve` never calls `HealthRegistry::record` (counting-fake assertion over 1000 calls) [machine]"
  - "Allocation budget: at most 2 heap allocations on the success path (counting allocator test) [machine]"
  - "`Err(NoCandidate)` enumerates every chain entry with a reason, in chain order [machine]"
  - Unknown role returns `UnknownRole` [machine]
  - "`cargo test -p conway-routing` passes including tests/router_resolution.rs [machine]"
