  - "`RequiredCaps::satisfied_by(&Capabilities, est_tokens: u32)` enforces `est_tokens.saturating_add(headroom_tokens) <= max_context_tokens`; unit tests cover a failing case whose Err message names est, headroom, max, and shortfall; a passing case; and a saturating-arithmetic no-panic case [machine]"
  - "`RoutingConfig` deserializes from the architecture TOML snippet extended with `default_headroom_tokens` and a per-role `headroom_tokens` key; a unit test round-trips it [machine]"
  - All enums are `#[non_exhaustive]`; all types are `Serialize + Deserialize + Clone + Debug` [machine]
  - "`cargo test -p conway-core` passes [machine]"
