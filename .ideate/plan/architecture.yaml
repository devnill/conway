id: architecture
type: architecture
title: conway architecture v0.1 (MVP design)
cycle_created: 0
cycle_modified: null
summary: Cargo workspace of 8 crates in a ports-and-adapters (hexagonal) shape. All domain types and port traits live in conway-core (no I/O); implementations live in dedicated crates; dependency direction is strictly downward with no cycles. The one would-be cycle (the fork/spawn tool driving the runtime) is broken by the SubagentHost port trait defined in conway-core, implemented by conway-runtime, and handed to tools through ToolCtx.
crates:
  - name: conway-core
    purpose: Domain types + all port traits (Backend, Plugin/Tool, PermissionGate, SessionStore, Router, HealthRegistry, SubagentHost, EventSink), Provenance enum, Event enum, AgentResult, fakes behind cfg(feature=fakes). Depends on nothing in workspace.
  - name: conway-backends
    purpose: AnthropicBackend (native Messages API, API key only) and OpenAiCompatBackend with a Dialect field (OpenAi | Ollama | VllmHermes | LmStudio | LlamaCppServer) selecting tool-call accumulators and quirk workarounds. CapabilityProbe, ToolCallAccumulator, ModelMetadata loader (models.dev-derived local file, never a network dependency). Feature-gated per backend.
  - name: conway-routing
    purpose: "DeclarativeRouter (role alias to ordered candidate chain from static TOML config; pure w.r.t. request content - RouteRequest has no prompt-text field by construction) and BreakerRegistry (two independent circuit breakers per endpoint: Transport and Probe, Olla pattern) plus HealthProber and RoutingExplain."
  - name: conway-session
    purpose: "JsonlSessionStore: one append-only .jsonl per session under .conway/sessions/, first line is header. fork() writes one header line referencing (parent, at_seq) - O(1), zero records copied. TranscriptResolver walks ancestry, memoized per (sid, at_seq) as Arc<[LogRecord]> so N siblings share one allocation. Derived rebuildable index."
  - name: conway-tools
    purpose: "Built-in plugins on the same Plugin/Tool traits third parties use: FsPlugin (read/write/edit/glob/grep), ShellPlugin (bash, process-group kill on cancel), SubagentPlugin (conway_subagent/steer/await/cancel - pure wrapper over SubagentHost, no fork logic), ReportPlugin (explicit AgentResult finalization). MUST NOT depend on conway-runtime."
  - name: conway-runtime
    purpose: "The engine: per-agent AgentLoop (one tokio task each), AgentTree + supervisor, bounded mailboxes (steer lands at turn boundaries only), ContextBuilder with fixed segment ordering + provenance, EventBus (broadcast, seq-ordered per session, agent-tagged flat events), PermissionBroker (decision cache over consumer gate), ToolRunner (bounded JoinSet), backend attempt/fallback loop recording health observations, budgets, SubagentHost implementation."
  - name: conway
    purpose: "Facade: ConwayBuilder (from_config/discover/with_* injection), config precedence CLI > env CONWAY_* > ./.conway/conway.toml > XDG > defaults, agent defs as markdown+YAML frontmatter in .conway/agents/*.md, built-in gates (AllowListGate, DenyAllGate, PromptingGate), Conway::new_session/resume/sessions/explain_routing, SessionHandle::prompt/events/fork/spawn/steer/await_agent/cancel/tree/context_report/transcript. Only stable public API; runtime internals not re-exported."
  - name: conway-cli
    purpose: "conway binary: interactive ratatui REPL (tree pane, permission prompts, /steer /tree /context /why /fork /spawn /resume) and one-shot -p mode (stdin or argv prompt, --output-format text|json|jsonl, streams as tokens arrive, stable exit codes 0/1/2/3/4/5/130, stdout program-output-only). Depends only on the conway facade."
fork_mechanics: "Fork inherits the forker's ENTIRE effective transcript as a literal ordered prefix plus a fork_directive prompt; spawn is clean-slate (agent_def required). No partial inheritance exists. Storage: fork writes one header line (O(1)); effective transcript = resolve(parent, 0..at_seq) ++ own records, recursive, memoized. Records below at_seq are frozen snapshots; parent appends after at_seq are invisible to the child; parent-to-child updates travel only via mailbox. ContextBuilder fixed segment order: [0] SystemPrompt, [1] SkillFragments, [2] ToolSchemas (cache breakpoint A), [3] InheritedPrefix (cache breakpoint B at fork boundary), [4] ForkDirective|Prompt, [5..] volatile own turns. PrefixKey = blake3(model_id + segments[0..=B]), stable across siblings. Stripping all cache hints must leave request bytes identical: cache is economics, never semantics."
messaging: "AgentMessage: Steer (lands at turn boundary only, becomes parent_steer LogRecord + user-role segment), Cancel (soft at boundary; hard trips CancellationToken, child still emits AgentResult{Cancelled}), Progress (child-to-parent, event-only, never enters parent context), Result (terminal, exactly one per child, resolves parent's pending subagent tool call). Bounded mpsc inbox capacity 64, steer overflow drops oldest + SteerDropped event. Supervisor synthesizes terminal results on budget exhaustion/cancel/panic - a parent await can never hang. AgentResult: status (Completed|Failed|Cancelled|BudgetExceeded|Rejected{missing}), bounded required summary, typed facts, artifacts, optional schema-validated structured output, transcript_ref (full child log, inspectable, never auto-injected), usage, steps_taken. MAST mitigations: literal prefix inheritance (no lossy summarization down), StepDigest repeated-step detection (blake3 of tool+args, warn on 3rd repeat), mandatory budgets, result_contract schema validation with one retry then Rejected, Rejected{missing} as first-class refusal."
event_stream: Flat Envelope{seq, ts, session, agent, event} broadcast; seq monotonic per session across the tree; AgentSpawned precedes all events for that agent; every AgentSpawned eventually followed by exactly one AgentFinished; slow consumers get Lagged{skipped}, full history recoverable from session log. Event enum covers agent lifecycle, turns, ModelDecision (emitted BEFORE every backend attempt including fallbacks - GP-07), text/thinking deltas, tool call lifecycle, permissions, ContextSegmentAdded, SteerQueued, RepeatedStep, BackendDegraded, Error. Deliberately shim-able to a future flat ACP adapter.
tool_call_strategy: "Streaming{validated:true}+tools: stream, one non-streaming retry on ToolParse error. Streaming{validated:false} or NonStreamingOnly + tools: generate() directly, text emitted as one delta. No tools registered: always stream. Caller-facing EventStream contract identical in all cases."
routing: "TOML role chains ([roles.planner] chain = [backend/model, ...]); resolve() synchronous, allocation-cheap, health- and capability-filtered, every chosen AND skipped candidate carries a RoutingReason; router never mutates breaker state; runtime records observations after attempts. BadRequest/Auth/ContextOverflow are not health signals. Failover-worthy: Transport/ServerError/RateLimit."
execution_order: "Group 0: conway-core (blocks everything). Group 1 (parallel): A conway-session, B OpenAiCompatBackend (Ollama dialect first), C conway-routing, D fs+shell plugins, E runtime skeleton (single-agent loop + ContextBuilder + EventBus + PermissionBroker against fakes). Slice 1 milestone: conway -p works against local Ollama with fs+bash, streams, persists JSONL session, correct exit codes - zero subagent code. Group 2 (parallel): F AnthropicBackend + cache hints, G fork/spawn (SubagentHost, AgentTree, supervisor, SubagentPlugin, SessionHandle::fork/spawn), H interactive TUI, I agent/skill definitions. Group 3: J mailboxes/steering/AgentResult/MAST mitigations, K fork/resume CLI, L provenance inspection, M fallback loop + routes explain. Group 4: golden-file tests, backend conformance suite, plugin-author docs + example plugin, OSS readiness. Critical path: core -> runtime skeleton + ContextBuilder -> session fork-by-reference -> G -> J -> L -> Group 4. Highest risk concentration: ContextBuilder + fork semantics (touches GP-01/02/06/10); golden-file tests from first commit."
design_tensions: "T-1 forked prefix exceeds child model context window (policy undecided - user decision). T-2 ContextOverflow needs a third category RequestIncompatible: advance chain without recording health. T-3 streaming tool-call retry double-bills: per-model stream_tools config derived from ReliabilityTier (verified backends stream, unverified default off). T-4 cache affinity vs role routing: no affinity input in MVP, measure first; possibly the largest cost lever. T-5 steering latency unbounded by long tool calls: SteerQueued visibility + hard-cancel escape; no steer_urgent in MVP. T-6 Anthropic cache TTL owner: config-owned (global + per-role); TTL drop 1h->5min needs primary-source verification. T-7 lossy result summaries: transcript_ref is a real JSONL file readable via existing fs tools; no new tool in MVP; result_contract available for strict callers. T-8 plugin ABI: in-process Arc<dyn Plugin> for MVP but all tool-facing types kept JSON-serializable so a subprocess/WASM representation remains possible; SubagentHost is the known non-serializable exception. T-9 token estimates are tokenizer-specific: report Estimated{tokenizer} with ~15% tolerance."
coverage_check: PASS - every MVP scope item mapped to owning modules; no overlapping responsibilities (routing policy vs attempt execution, persist-what vs persist-how, permission decision vs brokering vs classification, fork storage vs semantics vs tool surface all separated); out-of-scope items correctly unowned with seams reserved (CacheMode::SlotKv + prefix_key for llama.cpp slots, flat agent-tagged events for ACP shim, Plugin trait for MCP).
