dependency_graph: "G0: WI-001 (workspace+core skeleton). Core chain: 001 -> {002,004} -> {003,005} -> 006 -> 007 -> 008. After 008, four crate tracks run in parallel: backends 016->{017,018}->019->{020,021}->022; routing 031->{032,033}->034->{035,036}; session 046->047->048->{049,050}, 047->051; tools 061->{062,064,065,066}->063->067. Runtime chain: 076->{077,078}->079->080->081->082->083->084->085->086->087 (084 also needs session 048/049; 080 needs routing 034; 081 needs session 047). Facade: 096 (after crate skeletons) ->097->{098,099}->100 (needs 019,021,034,047,067,082) ->101->102 (needs 084,085) ->103 (needs 050,084). CLI: 111 (needs 101) ->112->113; 114->115; 116 (needs 103,113); 117 (needs 103,112,113). Validated DAG: 61 items, 18 topological levels, max width 12, zero concurrent file-scope overlaps."
notes: "Rationale: dependency structure is wide-then-narrow (Phase 2 has four independent crate tracks; the runtime chain is deep and mostly sequential). Batched parallel with a review checkpoint per phase matches GP-04 thin slices and the Slice-1 CLI milestone at the end of group 3. Cost sensitivity is moderate; max 4 concurrent workers keeps review load manageable on a first-of-its-kind codebase."
