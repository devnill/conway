title: conway
cycle_created: 0
cycle_modified: null
summary: "A Rust agent harness for agentic coding with first-class hierarchical forking. Fork (child inherits the forker's entire lean context as a literal prefix + a directive) and spawn (clean slate) are the two subagent primitives; context economy comes from tree structure, not selective inheritance. Consumed three equal ways: embeddable Rust library (primary: a Tauri IDE), interactive CLI, and stdin-streaming one-shot mode. Provider routing across local backends and cloud APIs is a core responsibility, built on capability-flagged native adapters that exploit each backend's prompt-caching mechanism at fork boundaries."
components:
  - "conway-core: domain types + all port traits (the plugin-author-facing contract crate)"
  - "conway-backends: Anthropic native + OpenAI-compatible (5-dialect) adapters"
  - "conway-routing: declarative role-alias router + circuit-breaker health registry"
  - "conway-session: JSONL append-only store with O(1) fork-by-reference and ancestry resolution"
  - "conway-tools: built-in fs/shell/subagent/report plugins on the public plugin API"
  - "conway-runtime: agent loops, tree supervisor, mailboxes, ContextBuilder with provenance, event bus, permission broker"
  - "conway (facade): ConwayBuilder, config, agent definitions, SessionHandle public API"
  - "conway-cli: interactive ratatui REPL + -p one-shot streaming binary"
structure: Cargo workspace, 8 crates, ports-and-adapters. Strictly downward dependencies; conway-core depends on nothing; the tools-to-runtime cycle is broken by the SubagentHost port. Backends feature-gated so embedders ship minimal binaries.
workflow: Consumer (IDE/CLI) builds a Conway via ConwayBuilder, opens a SessionHandle, prompts. The runtime assembles provenance-tagged context segments in a fixed cache-friendly order, routes via declarative role chains with health-filtered fallback, executes tools through the permission broker, and persists every record append-only before acting. Agents fork (full literal prefix, O(1) storage) or spawn (clean slate) children via the same SubagentHost the developer API uses; parents steer children at turn boundaries via mailboxes; children return structured AgentResults that always resolve. Everything is observable via a flat seq-ordered event stream (the IDE's render surface) and inspectable per-agent context reports.
