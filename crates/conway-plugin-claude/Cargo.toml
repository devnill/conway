[package]
name = "conway-plugin-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Reads a Claude Code plugin directory already on disk (board item 01M0VR89FB1F3Q4FQ8852K2A5E): translates its MCP server declarations into conway_plugin_mcp::McpPluginSpec values, maps its hook event names onto conway's own vocabulary where one exists, and reports by name everything it cannot use -- no downloading, no writing to the operator's own config"

# Read-at-runtime, not translate-and-write (this crate's own module doc has
# the full argument): a Claude Code plugin directory is parsed FRESH every
# time conway starts, never converted into a durable settings.json entry.
# That keeps the artifact -- the directory the operator already has --
# intact, reversible, and traceable to its own origin, and sidesteps needing
# a real array-entry config writer (`crates/conway/src/config/writer.rs`
# deliberately has none: it patches one id via a hand-rolled text edit,
# never parse-and-reserialize).

[dependencies]
# The ONLY workspace crate this reads a translated MCP declaration INTO --
# `McpPluginSpec` is the exact shape `conway-cli`'s own `mcp_plugins.rs`
# feeds `McpPlugin::discover`, so a translated Claude `.mcp.json` server
# becomes a REAL, working `conway::plugin::Plugin` through the identical
# path an operator-authored `[plugins].mcp[]` entry already uses -- no
# second MCP client implementation. This crate does NOT depend on `conway`
# (the facade) directly: it never constructs a `Plugin` itself, only the
# spec/port types a caller hands to one -- see `conway-core` immediately
# below for the one place that stopped being true.
conway-plugin-mcp = { path = "../conway-plugin-mcp" }
# Board item `01M0X1G29EZSFEWB1YAG40SE69`: `commands/*.md` translation
# produces real `conway_core::ports::Command` implementations
# (`commands::ClaudeCommand`) returning `CommandOutcome::SubmitPrompt` --
# this crate's lib-level doc used to say "does not depend on conway-core at
# all"; that statement was true only for the earlier hooks/MCP-only scope
# and is corrected here. Still NOT `conway` (the facade): `Command`/
# `CommandOutcome` live in `conway-core`, one layer below the facade, the
# same foundational tier `conway-plugin-mcp` itself sits on -- no cycle risk
# (`conway-core` depends on nothing in this workspace's upper layers).
conway-core = { path = "../conway-core" }
# `commands::ClaudeCommand`'s own `impl conway_core::ports::Command` --
# every `conway_core::ports` trait is `#[async_trait]`, the identical reason
# `hooks_dispatch.rs`'s own inline `PermissionGate` double already needed
# this (previously dev-only; now a real production dependency for this
# crate's own trait impl, not just its tests).
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `commands/*.md` frontmatter is Claude Code's own YAML convention (the
# SAME `---`-delimited block `conway`'s own `skills.rs`/`agents.rs` parse
# for conway's OWN frontmatter) -- `serde_yaml` is already a workspace
# dependency (`conway/Cargo.toml`'s own use for that identical shape);
# `commands.rs` reads it PERMISSIVELY (this crate's own top doc, question 2:
# `serde_yaml::Value`/a flattened catch-all map, never `deny_unknown_fields`
# -- an unrecognized Claude Code key is named, not a hard parse failure).
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The public facade, for this crate's own end-to-end tests (proving a
# translated MCP declaration becomes a real, invokable `Tool` -- acceptance
# 2's "demonstrated end to end" requirement -- and, board item
# `01M0X1FCQ80C9ET97HENXSAW2K`, that a translated `hooks.json` rule becomes
# a real, dispatching `[hooks].rules[]` entry) -- test-only, never named in
# `src/`. `test-support` (implies `testkit`) is what puts
# `conway::test_support::test_builder` and friends in reach, the same
# feature `conway`'s own test suite dev-depends on itself for.
conway = { path = "../conway", features = ["test-support"] }
conway-testkit = { path = "../conway-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
