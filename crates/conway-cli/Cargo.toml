[package]
name = "conway-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The `conway` CLI: interactive TUI, `-p` one-shot mode, and session/routing introspection subcommands, built entirely over the `conway` facade"

[[bin]]
name = "conway"
path = "src/main.rs"

[features]
# Mirrors the facade's own `jsonl-store` feature name (`conway/Cargo.toml`)
# so `src/first_party_plugins.rs` can `#[cfg(feature = "jsonl-store")]` on
# whether `conway::memory::FsMemoryStore` (this crate's durable
# `conway.memory` backing store) is actually compiled in, rather than
# assuming it always is. On today's `conway = { path = "../conway" }` line
# below (no `default-features = false`), `conway`'s own default features
# already turn its `jsonl-store` on regardless of this crate's own feature
# resolution -- this declaration exists so the cfg name is recognized (not
# an `unexpected_cfgs` warning under `-D warnings`) and so the forwarding is
# correct IF that dependency line ever adds `default-features = false`.
default = ["jsonl-store"]
jsonl-store = ["conway/jsonl-store"]

[dependencies]
conway = { path = "../conway" }
# The first-party plugin tier (board item 01KZDC3JQ7W4DY1MG6MBCVB2DV): the
# ONE binary that links a first-party plugin crate -- `conway` (the facade)
# deliberately does not (see `conway::config::schema::PluginsConfig`'s own
# doc). See `src/first_party_plugins.rs` for the install path this crate's
# dependency feeds.
conway-plugin-skeleton = { path = "../conway-plugin-skeleton" }
# Board item 01KZY8Q1CMMNVSF54CTC270N3H: `/conway.history.rewind` -- the
# same "the shipped binary is the one place a first-party plugin crate is
# linked" pattern the line above establishes. See `src/
# first_party_plugins.rs`'s `bundle` for the install path this dependency
# feeds; NOT installed by default (no entry in any default
# `[plugins].install` list) -- an operator opts in the same way they would
# for `conway-plugin-skeleton`.
conway-plugin-history = { path = "../conway-plugin-history" }
conway-plugin-stepguard = { path = "../conway-plugin-stepguard" }
# Board item 01M03GMNB3P048G72M158XPDG2: progressive skill disclosure -- a
# `ContextHook` that narrows full-body `Provenance::Skill` segments to a
# one-line index plus a `read_skill` tool. Resolved through the SAME
# `[plugins].install` mechanism and the same `src/first_party_plugins.rs`
# choke point as the lines above; NOT installed by default. Its
# `ContextHook` installs via `Plugin::context_hooks` (the SAME
# `with_plugin`/`install_selected` surface its tool uses), so
# `[plugins].install = ["conway.skills"]` is the whole of the wiring.
conway-plugin-skills = { path = "../conway-plugin-skills" }
# Board item 01KZFC43J1J06BM4CCWKCKHSNV: the routing engine `conway` itself
# used to compile in directly is now a first-party plugin too, resolved
# through the SAME `[plugins].install` mechanism and the same `src/
# first_party_plugins.rs` choke point as the line above (see that file's
# `router_bundle`).
conway-plugin-routing = { path = "../conway-plugin-routing" }
# Board item 01KZHF270T3W8GZ7NM6DSNQ4MM: both provider-adapter dialects
# `conway` itself used to compile in directly are now first-party plugins
# too, resolved through the SAME mechanism -- see `src/
# first_party_plugins.rs`'s `backend_bundle`. Unlike the two crates above,
# these attach by DEFAULT (no `[plugins].install` entry required -- see
# `conway::config::schema::PluginsConfig::default_backends`'s own doc):
# `main.rs`'s `build_conway` unions that key into `wanted` before calling
# `first_party_plugins::install`.
conway-plugin-backends = { path = "../conway-plugin-backends" }
# Board item 01KZY8PATND84AKY0J376E3DWV: the subprocess plugin host. Unlike
# every other `conway-plugin-*` dependency above, this crate's own tools are
# NOT compiled in at all -- it is a HOST mechanism (a `Plugin` that talks to
# an external process named in `settings.json`), resolved through
# `src/subprocess_plugins.rs`, a NEW, separate choke point from
# `first_party_plugins.rs`'s `[plugins].install` resolution (this tier has
# no closed candidate set to resolve an id against; every entry in
# `[plugins].subprocess` is spawned, by construction). See that module's
# own doc for the full wiring and the trust disclosure this dependency
# carries.
conway-plugin-subprocess = { path = "../conway-plugin-subprocess" }
# Board item 01M03GPNF0KN59FHAEEAEY2JD3: the MCP-over-stdio CLIENT plugin. A
# sibling host mechanism to `conway-plugin-subprocess` above -- like it, this
# crate's own tools are NOT compiled in at all; it is a HOST mechanism (a
# `Plugin` that speaks JSON-RPC 2.0 as a CLIENT to an external MCP server named
# in `settings.json`), resolved through `src/mcp_plugins.rs`, a SEPARATE
# choke point from `subprocess_plugins.rs` (the two speak DIFFERENT wire
# protocols -- JSON-RPC 2.0 vs conway wire). See that module's own doc for the
# full wiring and the trust disclosure this dependency carries (identical
# footing to `conway-plugin-subprocess` above).
conway-plugin-mcp = { path = "../conway-plugin-mcp" }
# Board item 01M0VR89FB1F3Q4FQ8852K2A5E: the Claude Code plugin
# compatibility layer -- reads a Claude Code plugin directory the operator
# already has on disk and translates its `.mcp.json` server declarations
# into real `conway_plugin_mcp::McpPluginSpec` values. A sibling host
# mechanism to `conway-plugin-mcp`/`conway-plugin-subprocess` above: this
# crate's own tools are NOT compiled in; it is a TRANSLATION layer,
# resolved through `src/claude_compat_plugins.rs`, a fourth, separate
# choke point from `first_party_plugins.rs`/`subprocess_plugins.rs`/
# `mcp_plugins.rs`. See that module's own doc for the full wiring and the
# trust disclosure this dependency carries.
conway-plugin-claude = { path = "../conway-plugin-claude" }
# Board item 01M090JY3KYHQQMKCZZM1Y6EDZ: `conway.memory` -- the cross-tree
# curator that recalls records from explicitly labelled past sessions
# (DESIGN-context-path §11.7). Resolved through the SAME `[plugins].install`
# mechanism and the same `src/first_party_plugins.rs` choke point as the
# lines above; NOT installed by default (an operator opts in the same way
# they would for `conway-plugin-skeleton`/`conway-plugin-history`).
conway-plugin-memory = { path = "../conway-plugin-memory" }
# Board item 01M0PEFMG96SVBBD5D2E06H34A: `conway.path` -- the tool a model
# calls to compose a session's context path (decision
# 01M0K4QT6MBXPD6PXMBBBD2P7B). Resolved through the SAME `[plugins].install`
# mechanism and the same `src/first_party_plugins.rs` choke point as the
# lines above; NOT installed by default -- an operator opts in the same way
# they would for `conway-plugin-memory`/`conway-plugin-skills`. History:
# this is the SHAPE of dependency `conway-plugin-trim` itself lacked for a
# time (see that line's own comment below, and board item
# 01M0TV447NAJ1R06S455DZPP54) -- naming `"conway.trim"` in
# `[plugins].install` reached nothing until this crate started depending on
# it too.
conway-plugin-path = { path = "../conway-plugin-path" }
# Board item 01M0PS8J3AK7Z7253Z3E3RD3GY: `conway.discover` -- the tool a
# model calls to find a session/record it does not already hold a
# reference to, feeding `conway.path`'s `compose_context_path`. Resolved
# through the SAME `[plugins].install` mechanism and the same
# `src/first_party_plugins.rs` choke point as the lines above; NOT
# installed by default -- an operator opts in the same way they would for
# `conway-plugin-path`/`conway-plugin-memory`.
conway-plugin-discover = { path = "../conway-plugin-discover" }
# Board item 01M0VR3BKW5N3V3WS28H7FV8ZK: `conway.idiom`, a plugin that
# prepends a short conway-idioms instruction fragment (fork vs. spawn, how
# an agent ends, configuration-dependent tools, context, permissions,
# budgets, steering) to a session -- the operator's own "we send minimal
# data, add a little extra if desired" framing. Resolved through the SAME
# `[plugins].install` mechanism and the same `src/first_party_plugins.rs`
# choke point as every other line in this list; NOT installed by default,
# an operator opts in the same way they would for
# `conway.path`/`conway.discover` immediately above.
conway-plugin-idiom = { path = "../conway-plugin-idiom" }
# Board item 01M0TV447NAJ1R06S455DZPP54: `conway.trim`, the `Curator` that
# omits tool call/result round-trips older than a configurable turn window
# (`crates/conway-plugin-trim`'s own module doc). Resolved through the
# SAME `[plugins].install` mechanism and the same
# `src/first_party_plugins.rs` choke point as every other line in this
# list; NOT installed by default, an operator opts in the same way they
# would for `conway.path`/`conway.discover` immediately above. History:
# this line is exactly what `conway-plugin-trim` lacked before this item
# -- a real dependency line, plus the reachability test
# (`conway_trim_curator_omits_old_tool_round_trips_once_installed`) that
# proves `"conway.trim"` in `[plugins].install` reaches this plugin's own
# `Curator` against the real compiled binary, not merely that it compiles.
conway-plugin-trim = { path = "../conway-plugin-trim" }
# Board item 01M0TV5BSE98S16SFYECG9G9WP (decision 01M0TV3ZZBDKSSV7MD0FW3FSY7):
# `conway.names`, operator-chosen names for agents. Resolved through the
# SAME `[plugins].install` mechanism and the same
# `src/first_party_plugins.rs` choke point as every other line in this
# list; NOT installed by default -- an operator opts in the same way they
# would for `conway.trim`/`conway.memory`.
#
# This dependency carries one thing none of the others do: the
# `AgentNames` TRAIT itself, which this crate names directly (in
# `src/tui/state.rs`, `src/tui/commands.rs`'s `resolve_agent`, and
# `src/tui/view/agents.rs`). That is deliberate and is the whole shape of
# the decision -- the trait lives beside its implementation in the plugin
# crate so that `conway-core` never learns the word "name", and this
# already-existing dependency edge is what makes naming it here legal. See
# `crates/conway-plugin-names/src/lib.rs`'s module doc.
conway-plugin-names = { path = "../conway-plugin-names" }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
async-trait = { workspace = true }
futures = { workspace = true }
# `unstable-rendered-line-info`: `Paragraph::line_count(width)`, used by
# `tui/view/transcript.rs`'s scroll-clamp math (the TUI transcript-scrolling
# item) to measure the SAME wrapped-line count `Paragraph::render` actually
# draws with, rather than hand-rolling a second word-wrap implementation
# that could drift out of sync with it. "Unstable" is ratatui's own
# semver-stability marker for the API shape, not a usability/soundness
# caveat -- this is the documented, supported way to measure wrap height.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
# T8: `bracketed-paste` (on top of the workspace default `event-stream`)
# gates crossterm's `Event::Paste`/`EnableBracketedPaste`/
# `DisableBracketedPaste` -- without it the terminal never emits a paste
# event at all, and `tui/mod.rs`'s enable/disable calls and `app.rs`'s
# `CEvent::Paste` handling would not even compile. Adds a Cargo feature on
# an already-present dependency, not a new crate (C-04).
crossterm = { workspace = true, features = ["bracketed-paste"] }
serde_json = { workspace = true }
# Board item 01KZVYYWZ85D1SYMCSRRZ7RAM3 (Stage 2a): `TuiSection`/`ThemeConfig`/
# `ThemeStyleConfig`/`StatusLineConfig` moved here from `conway::config::
# schema` -- see `src/tui/config.rs` -- so this crate now derives
# `Serialize`/`Deserialize` on its own presentation-config types directly,
# rather than only consuming `serde_json::Value`.
serde = { workspace = true }
# WI-121: `-v`/`-vv` install a `tracing_subscriber::fmt` subscriber to
# stderr (`main.rs`) so the `tracing::{trace,info,warn,error}!` calls
# already scattered through conway-runtime/-backends/-session/conway
# become visible instead of going nowhere.
tracing-subscriber = { workspace = true }
# Board item 01M0VR89FB1F3Q4FQ8852K2A5E: `tui/app/startup.rs`'s
# `claude_compat_plugins` state population logs a `tracing::warn!` when a
# re-read of an already-installed `[plugins].claude_compat[]` directory
# fails at DISPLAY time (a filesystem race between `claude_compat_plugins::
# install` and this later, cosmetic re-parse) -- degrading that one `/plugin`
# row rather than panicking. Already a pinned workspace dependency
# (`tracing-subscriber` above depends on it transitively; every
# `conway`/`conway-runtime`/etc. crate this binary links already emits
# through it), just not previously named directly by production code in
# this crate (C-04, not a new one).
tracing = { workspace = true }
# WI-116: `commands::fmt`'s `ts`/`id_short` helpers and `commands::routes`'
# breaker-state rendering need to name `chrono::DateTime<Utc>` -- `conway`
# re-exports several `chrono`-typed fields (e.g. `SessionMeta::created`) but
# using them by field access doesn't require naming the crate; formatting
# them does.
chrono = { workspace = true }
# `--output-schema`: `oneshot.rs` names `schemars::schema::RootSchema` by
# type (the shape `conway::SessionSpec::result_contract` requires) when
# resolving the flag's precedence with `--agent`'s own def-declared
# contract -- already a workspace dependency (`conway`, `conway-core`,
# `conway-runtime` all depend on it; C-04, not a new one), just not
# previously named directly by this crate.
schemars = { workspace = true }

[dev-dependencies]
# Board item 01M0TV8MSFRHHQ5BNZV3NHZCEW: this crate's tests reach
# `conway::test_support` (the shared `build_conway`/`test_builder` wiring
# that used to be hand-rolled per test file), which is behind the facade's
# off-by-default `test-support` feature. Dev-only: nothing in `src/` may
# name it.
conway = { path = "../conway", features = ["test-support"] }
# Board item 01KZFC43J1J06BM4CCWKCKHSNV: `main.rs`'s own `tracing_target_
# tests` module additionally constructs a scoped subscriber
# (`tracing::subscriber::with_default`, test-only -- production code never
# constructs one by hand outside this module) to verify the `-v`/`-vv`
# target-list string by observing actual filtered output rather than
# reading the source line. `tracing` itself moved to `[dependencies]`
# (board item 01M0VR89FB1F3Q4FQ8852K2A5E, `tui/app/startup.rs`'s own
# `tracing::warn!`) -- this dev-only USE (the scoped-subscriber
# construction) is what remains test-only, not the crate dependency edge
# itself any more.
# Test-only: used exclusively to construct `conway_core::{error,agent,event}`
# fixture values for `exit.rs`/`oneshot.rs`/`render/*.rs`'s unit tests (see
# `exit.rs`'s doc comment for why this cannot be a production dependency).
# Never referenced outside `#[cfg(test)]` code.
conway-core = { path = "../conway-core" }
# `tui/app.rs`'s own test module builds a fully in-memory `Conway`
# (`conway_testkit::{FakeBackend, FakeGate, FakeRouter, FakeStore}`) to
# drive a real `App::submit` end to end and assert a prompt appears in the
# transcript exactly once -- the same fake port set `conway`'s own
# `tests/session_handle.rs` uses, just reached as a dev-dependency here
# instead of a regular one (`no_forbidden_deps`, `cli_surface.rs`, only
# inspects `[dependencies]`, never `[dev-dependencies]`, so this stays
# within that boundary).
conway-testkit = { path = "../conway-testkit" }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
# WI-113: the hand-rolled `tests/common/mock_backend.rs` OpenAI-compatible
# mock server (request parsing) and its SIGINT-delivery tests (unix-only).
httparse = { workspace = true }
# "fs" (board item 01KZFC1KNGQ51TZ0BG7P7RAY9H): `nix::unistd::{dup,dup2}`,
# gated behind this feature, back
# `tests/routes_explain_injected_router.rs`'s in-process stderr capture --
# not a new dependency (C-04), `nix` is already present for the "signal"
# feature above.
nix = { workspace = true, features = ["signal", "fs"] }
# WI-113: `tests/common/mock_backend.rs` needs a raw TCP listener/stream
# (`net`) and async read/write helpers (`io-util`) to serve real chunked
# HTTP responses -- the shipped binary itself never touches raw sockets
# (reqwest/hyper-util own that at runtime), so these stay test-only.
tokio = { workspace = true, features = ["net", "io-util"] }
