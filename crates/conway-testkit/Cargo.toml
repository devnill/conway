[package]
name = "conway-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Test doubles for every conway-core port trait (FakeBackend, FakeStore, FakeGate, FakeRouter, FakeHealth, FakeSubagentHost, CollectingEventSink, ...), for testing tools/plugins/backends against conway-runtime-shaped behaviour with zero network and zero filesystem access"

[dependencies]
# The only workspace crate this depends on -- the port traits and domain
# types the doubles below implement. Never the reverse (T1: `conway-core`
# depends on no workspace crate at all).
conway-core = { path = "../conway-core" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
