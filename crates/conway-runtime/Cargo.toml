[package]
name = "conway-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Agent engine: event bus, agent loop/tree, context assembly, tool execution, and multi-agent supervision for the conway agent harness"

[dependencies]
conway-core = { path = "../conway-core" }
conway-session = { path = "../conway-session" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Not in the WI-076 binding dependency list by name, but mechanically
# required by WI-077: `ContextBuilder` derives deterministic `SegmentId`s
# (blake3 of position/provenance/content, reinterpreted as a `ulid::Ulid`)
# so golden-file output and the cache-neutrality property are reproducible
# across builds — see `context/builder.rs`. `conway_core::ids::SegmentId`'s
# inner field is `pub ulid::Ulid`, so naming that type requires the crate
# directly.
ulid = { workspace = true }
# Not in the WI-076 binding dependency list by name, but mechanically
# required: `conway_core::event::Envelope::ts` is a `chrono::DateTime<Utc>`,
# and `EventBus::emit` constructs one directly.
chrono = { workspace = true }
# Promoted from dev-dependencies (WI-086): `SubagentSpec::result_contract`
# (conway-core) is a `schemars::schema::RootSchema`, and
# `result::validate_result_contract` names that type directly to validate a
# `structured` result against it -- no longer test-only.
schemars = { workspace = true }

[dev-dependencies]
conway-core = { path = "../conway-core", features = ["fakes"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
