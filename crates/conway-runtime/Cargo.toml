[package]
name = "conway-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Agent engine: event bus, agent loop/tree, context assembly, tool execution, and multi-agent supervision for the conway agent harness"

[dependencies]
conway-core = { path = "../conway-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Not in the WI-076 binding dependency list by name, but mechanically
# required by WI-077: `ContextBuilder` derives deterministic `SegmentId`s
# (blake3 of position/provenance/content, reinterpreted as a `ulid::Ulid`)
# so golden-file output and the cache-neutrality property are reproducible
# across builds — see `context/builder.rs`. `conway_core::ids::SegmentId`'s
# inner field is `pub ulid::Ulid`, so naming that type requires the crate
# directly.
ulid = { workspace = true }
# Not in the WI-076 binding dependency list by name, but mechanically
# required: `conway_core::event::Envelope::ts` is a `chrono::DateTime<Utc>`,
# and `EventBus::emit` constructs one directly.
chrono = { workspace = true }
# Promoted from dev-dependencies (WI-086): `SubagentSpec::result_contract`
# (conway-core) is a `schemars::schema::RootSchema`, and
# `result::validate_result_contract` names that type directly to validate a
# `structured` result against it -- no longer test-only.
schemars = { workspace = true }
# Board item 01M1FSJ4E2S5M9KBSBJAAPJQ48: `attempt.rs`'s same-candidate
# stream retry draws its backoff sleep from the same full-jitter window
# `conway-plugin-backends`'s `HttpClient::send_with_retry` already draws
# from (`conway_core::retry::max_jitter`) -- already in `Cargo.lock` via
# that crate, so this adds no new lock entry.
rand = { workspace = true }

[dev-dependencies]
conway-testkit = { path = "../conway-testkit" }
# Test-only edge, not an architectural one (T4 in
# `crates/conway/tests/architecture_invariants.rs` checks `[dependencies]`
# only): `tests/context_report_persistence.rs` exercises the moved
# `conway_core::provenance` helpers through `conway_session`'s re-export as
# well as through this crate's own `context::report` wrapper, to prove both
# paths agree. Board item 01KZVYVTVWRH20R6VJ6G3SWTJ6, "Stage 1a".
conway-session = { path = "../conway-session" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
