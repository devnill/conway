[package]
name = "conway-plugin-discover"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "First-party plugin (board item 01M0PS8J3AK7Z7253Z3E3RD3GY): conway.discover, the tool that finds a session/record a model does not already hold a reference to, feeding compose_context_path (decision 01M0K4QT6MBXPD6PXMBBBD2P7B)"

[dependencies]
# The ONLY workspace crate this plugin depends on -- the public facade, the
# exact surface a third-party plugin author gets (GP-03/P-6). `Tool`,
# `ToolCtx` (whose `session_discovery: SessionDiscoveryHandle` field this
# crate calls by method dispatch only, never by naming the handle/host
# types -- mirrors `conway-plugin-path`'s own `context_path` precedent
# exactly), and the search query/result value types are all reachable
# through `conway`/`conway::plugin` alone.
conway = { path = "../conway" }
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only: builds a real, in-memory `Conway` (fake backend/gate/router,
# real `FakeStore` pre-seeded directly) to drive this plugin's tool through
# real turns end to end, and proves the pair with `conway-plugin-path`'s
# `compose_context_path` -- the whole point of this item (board item's own
# acceptance criterion 1: "prove the pair works together, not each half
# separately").
conway-testkit = { path = "../conway-testkit" }
conway-plugin-path = { path = "../conway-plugin-path" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Draining `SessionHandle::events()` (an `EventStream`) turn-boundary-exact,
# mirroring `conway-plugin-path`'s own end-to-end test.
futures-core = { workspace = true }
