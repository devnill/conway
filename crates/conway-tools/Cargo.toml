[package]
name = "conway-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Built-in conway-core Plugin/Tool implementations: fs, shell, subagent, report"

[features]
default = []
# Exposes `testing` (FakeSubagentHost, RecordingEventSink, test_ctx) to
# external crates/integration tests. The module is *also* compiled under
# `cfg(test)` regardless of this feature, so this crate's own unit tests
# (`cargo test -p conway-tools`, no extra flags) always have it available.
# Normal (`cargo build`) builds never include it either way.
test-fakes = []

[dependencies]
conway-core = { path = "../conway-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
cap-std = { workspace = true }
# `SubagentHost::tree() -> AgentTreeSnapshot` (conway-core) carries a
# `chrono::DateTime<Utc>`; not listed in the WI-061 dependency notes but
# mechanically required to implement the trait's return type.
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "rt", "time", "sync"] }
# `process::child_session` (board item `01M0TV7ZDS8X4F4TEJPRZB9P6T`) warns on
# a dropped/degraded inbound notification line the same way
# `conway-plugin-subprocess`'s own wire deserializer already does (see that
# crate's Cargo.toml comment on its own `tracing` entry) -- already a
# workspace dependency several other crates use for the identical
# audit-logging purpose, not a new one (C-04).
tracing = { workspace = true }

# `fs` additionally pulls in `nix::fcntl::openat`/`Mode`, used by
# `fs::beneath::sync_confined_parent_dir`'s unix implementation (board item
# `01M3B8E33XKP03MSSFDKEJPH67`) to reopen a `cap_std::fs::Dir`'s own fd via
# `openat(dirfd, ".", ...)` -- see that function's doc for why.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# Board item 01M3CMQZZCSRF7YB9GEMA92M0C: `tests/kill_group.rs`,
# `tests/hook_runner.rs` and `tests/child_session_grace.rs` each write a
# fresh `#!/bin/sh` fixture and must launch it via `/bin/sh <path>`, not
# `Command::new(path)`'s direct exec of the file just written -- see
# `conway-test-fixtures`'s own crate doc for the ETXTBSY ("Text file busy")
# race this closes and the measurements behind it (originally fixed only in
# `kill_group.rs`, board item `01M3CCB39A1SKWFQEKC2CZK7S9`; this crate is
# that ONE implementation, per P-14, folded out to all three). Workspace-
# internal, dev-only (C-04): nothing in `src/` may name it.
conway-test-fixtures = { path = "../conway-test-fixtures" }

[[test]]
name = "common_helpers"
path = "tests/common_helpers.rs"
required-features = ["test-fakes"]

[[test]]
name = "fs_core"
path = "tests/fs_core.rs"
required-features = ["test-fakes"]

[[test]]
name = "fs_search"
path = "tests/fs_search.rs"
required-features = ["test-fakes"]

[[test]]
name = "shell_bash"
path = "tests/shell_bash.rs"
required-features = ["test-fakes"]

[[test]]
name = "report"
path = "tests/report.rs"
required-features = ["test-fakes"]

[[test]]
name = "subagent"
path = "tests/subagent.rs"
required-features = ["test-fakes"]

[[test]]
name = "builtins"
path = "tests/builtins.rs"
required-features = ["test-fakes"]

[[test]]
name = "fs_confinement"
path = "tests/fs_confinement.rs"
required-features = ["test-fakes"]
