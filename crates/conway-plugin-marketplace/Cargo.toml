[package]
name = "conway-plugin-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Fetches a marketplace manifest and a plugin's declared files over HTTP into conway's plugin store (board item 01M0VR96Y87FF2BVNTBSC6GEYR) -- the ONE crate in this workspace besides conway-plugin-backends that touches the network, so that conway-cli itself never gains a direct reqwest dependency (dependency minimalism: the network edge lives behind one narrow, purpose-built facade, not scattered across every crate that eventually wants it)"

# **Why this crate exists instead of a network call inside conway-cli
# directly.** `crates/conway-cli/Cargo.toml` has no HTTP client today, and
# `reqwest` otherwise lives behind `conway-plugin-backends`'s own facade for
# provider calls only. The zero-dependency path -- reading a marketplace
# response and a plugin's files with no HTTP client at all -- does not
# exist: there is no way to fetch bytes over HTTP without one. Given a
# dependency is unavoidable, dependency minimalism's SECOND question
# applies: is there already something in the workspace lock to reuse rather
# than adding a second HTTP stack? `reqwest` already sits in
# `[workspace.dependencies]` and is compiled into this workspace today via
# `conway-plugin-backends` (`crates/conway-plugin-backends/src/http.rs`, "the
# sole consumer of the crate's reqwest dependency" for THAT crate) -- so this
# crate adds a new consumer of an existing dependency, not a new dependency
# to the Cargo.lock at all. `reqwest` is not re-exported: this crate's own
# `install`/`browse` functions build their own `reqwest::Client` internally
# and take a marketplace URL/plugin id as plain strings, so a caller
# (`conway-cli`) never needs to construct or even name a `reqwest` type
# itself -- the same "conway-cli stays free of the transport crate, the
# plugin crate owns it" boundary `conway-plugin-backends` already
# establishes for provider calls, drawn here for plugin distribution.
#
# **What this crate does NOT do, disclosed rather than silently assumed.**
# It does not clone a git repository and it does not extract a compressed
# archive (`.tar.gz`/`.zip`) -- either would be a genuinely NEW dependency
# (`git2`/`tar`/`zip`, none of which are in this workspace's lock today),
# and P-10's symlink-in-an-extracted-archive hazard is a real, nontrivial
# safety surface a first cut should not take on casually. A marketplace
# manifest instead lists each plugin's files as an explicit `{relative
# path -> URL}` map -- every file is fetched and validated individually, so
# there is no archive-extraction step and therefore no symlink-in-an-archive
# class of attack to defend against at all (see `install.rs`'s own doc for
# the full path-safety argument). This is a scoping decision, not an
# oversight -- see the board item's own completion report for the
# discussion.

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "macros"] }

[dev-dependencies]
# The public facade, for this crate's own end-to-end test (board item
# 01M0VR96Y87FF2BVNTBSC6GEYR's acceptance 1: "install a plugin, and use
# it") -- proves an installed marketplace plugin's own `.mcp.json`
# declaration becomes a real, invokable `conway::plugin::Tool`, through
# `conway_plugin_claude::discover` -> `conway_plugin_mcp::McpPlugin::
# discover`, the identical downstream path `conway-plugin-claude`'s own
# end-to-end test already proves for a directory the operator placed by
# hand. Test-only: this crate's own `src/` never depends on either.
conway = { path = "../conway" }
conway-plugin-claude = { path = "../conway-plugin-claude" }
conway-plugin-mcp = { path = "../conway-plugin-mcp" }
conway-testkit = { path = "../conway-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
wiremock = { workspace = true }
