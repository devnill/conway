[package]
name = "conway-plugin-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Fetches a marketplace manifest and installs a plugin from it into conway's plugin store, over HTTP (a conway-native files-map entry) or via the system git binary (a real Claude Code git-subdir/github entry) -- board items 01M0VR96Y87FF2BVNTBSC6GEYR and 01M0Y6RYZA94BK6YXJ7X8TNEGR -- the ONE crate in this workspace besides conway-plugin-backends that touches the network, so that conway-cli itself never gains a direct reqwest dependency (dependency minimalism: the network edge lives behind one narrow, purpose-built facade, not scattered across every crate that eventually wants it)"

# **Why this crate exists instead of a network call inside conway-cli
# directly.** `crates/conway-cli/Cargo.toml` has no HTTP client today, and
# `reqwest` otherwise lives behind `conway-plugin-backends`'s own facade for
# provider calls only. The zero-dependency path -- reading a marketplace
# response and a plugin's files with no HTTP client at all -- does not
# exist: there is no way to fetch bytes over HTTP without one. Given a
# dependency is unavoidable, dependency minimalism's SECOND question
# applies: is there already something in the workspace lock to reuse rather
# than adding a second HTTP stack? `reqwest` already sits in
# `[workspace.dependencies]` and is compiled into this workspace today via
# `conway-plugin-backends` (`crates/conway-plugin-backends/src/http.rs`, "the
# sole consumer of the crate's reqwest dependency" for THAT crate) -- so this
# crate adds a new consumer of an existing dependency, not a new dependency
# to the Cargo.lock at all. `reqwest` is not re-exported: this crate's own
# `install`/`browse` functions build their own `reqwest::Client` internally
# and take a marketplace URL/plugin id as plain strings, so a caller
# (`conway-cli`) never needs to construct or even name a `reqwest` type
# itself -- the same "conway-cli stays free of the transport crate, the
# plugin crate owns it" boundary `conway-plugin-backends` already
# establishes for provider calls, drawn here for plugin distribution.
#
# **What this crate does NOT do, disclosed rather than silently assumed --
# amended by board item `01M0Y6RYZA94BK6YXJ7X8TNEGR`, partially reversed
# from the paragraph this replaces, not left contradicting the code.** It
# still does not extract a compressed archive (`.tar.gz`/`.zip`) -- that
# would be a genuinely NEW dependency (`tar`/`zip`, neither of which is in
# this workspace's lock today), and P-10's symlink-in-an-extracted-archive
# hazard is a real, nontrivial safety surface this crate still declines. A
# files-map marketplace entry keeps listing each file as an explicit
# `{relative path -> URL}` map, fetched and validated individually, for
# exactly that reason (`install.rs`'s own doc has the full path-safety
# argument). **It now DOES fetch a git-sourced entry** (`git-subdir`/
# `github`, `crate::git_source`) -- ruled bounded, not opened wide: no git
# LIBRARY entered this lock (`git2` is still absent), because the ruling's
# own words are "invoke the system `git`" -- this crate shells out to
# whatever `git` binary is already on the operator's own `PATH`, refusing
# legibly (`MarketplaceError::GitUnavailable`) if there is none, so the
# dependency graph gains nothing new for this either. A git CHECKOUT is a
# narrower version of the archive-traversal hazard, not an absent one --
# `crate::git_source`'s own doc states how it is validated.

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# "process"/"time": `crate::git_source` invokes the system `git` binary as
# a child process (board item `01M0Y6RYZA94BK6YXJ7X8TNEGR`) and bounds it
# with `tokio::time::timeout`, exactly the shape this crate's own HTTP
# fetches already bound with `reqwest`'s client-level timeout. "io-util":
# `run_git_clone` drains the child's own stderr pipe with
# `AsyncReadExt::read_to_end` concurrently with `Child::wait`, rather than
# `Child::wait_with_output` (which CONSUMES the `Child`, leaving nothing to
# `.kill()` if the wait times out -- that function's own doc).
tokio = { workspace = true, features = ["fs", "rt", "macros", "process", "time", "io-util"] }

[dev-dependencies]
# The public facade, for this crate's own end-to-end test (board item
# 01M0VR96Y87FF2BVNTBSC6GEYR's acceptance 1: "install a plugin, and use
# it") -- proves an installed marketplace plugin's own `.mcp.json`
# declaration becomes a real, invokable `conway::plugin::Tool`, through
# `conway_plugin_claude::discover` -> `conway_plugin_mcp::McpPlugin::
# discover`, the identical downstream path `conway-plugin-claude`'s own
# end-to-end test already proves for a directory the operator placed by
# hand. Test-only: this crate's own `src/` never depends on either.
conway = { path = "../conway" }
conway-plugin-claude = { path = "../conway-plugin-claude" }
conway-plugin-mcp = { path = "../conway-plugin-mcp" }
conway-testkit = { path = "../conway-testkit" }
tempfile = { workspace = true }
# "sync": a stub-`git`-driven test (`install.rs`, `git_source.rs`) mutates
# the process-wide `CONWAY_MARKETPLACE_GIT_PROGRAM` env var this crate's
# own `git_source::GIT_PROGRAM_ENV` reads; a `tokio::sync::Mutex` held
# across the `.await` this involves is what serializes those tests against
# each other rather than racing on that one process-global value.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
wiremock = { workspace = true }
