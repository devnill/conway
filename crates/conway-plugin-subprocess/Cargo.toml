[package]
name = "conway-plugin-subprocess"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "The subprocess plugin host (board item 01KZY8PATND84AKY0J376E3DWV): a Plugin implementation that discovers its tools and answers tool calls by spawning an operator-configured out-of-process command, so a shipped conway binary gains a tool via a settings.json edit, no rebuild required"

# Versioned WITH the workspace, same footing `conway-plugin-skeleton`'s own
# Cargo.toml doc comment establishes for the first-party plugin tier -- this
# crate is the HOST mechanism (a Plugin that talks to a subprocess), not
# itself a first-party plugin offering end-user functionality, but it sits
# in the same crate-naming convention (`conway-plugin-*`) and carries the
# same versioning discipline.

[dependencies]
# The public facade -- the exact `conway::plugin` surface a third-party
# plugin AUTHOR gets (GP-03/P-6), proven by `conway-plugin-skeleton`'s own
# identical choice. This crate implements `Plugin`/`Tool` against that
# surface only; it does not reach into `conway-core` or `conway-runtime`
# directly, even though it is a HOST-side adapter rather than a leaf
# plugin, because the whole point is that a subprocess plugin host needs
# nothing more privileged than what any other plugin author already has.
# No `default-features = false` here (deliberately): this crate's own
# `kill_group` call (`src/lib.rs`, `session.rs`) is `conway::plugin::
# kill_group`, which `conway` only re-exports when its `builtin-tools`
# feature is on (default-on) -- board item `01M0EKVR1BEXXS75NV2JC4HZZ9`.
conway = { path = "../conway" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
# Audit logging for graceful unknown-tag degradation (board item
# `01M03VJPRT8629CYR8JK4A8JPF`): when a NEWER plugin sends an enum tag this
# host does not know, the wire deserializer degrades to the most restrictive
# value and emits a `tracing::warn!` NAMING the unknown tag, so the
# degradation is auditable without inventing a parallel status mechanism (the
# observe/1 wire point is a LATER item). Already a workspace dependency
# (`conway-runtime`, `conway-plugin-backends`, etc. use it the same way).
tracing = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
# NOT for the SIGTERM-then-SIGKILL process-group kill any more (board item
# `01M0EKVR1BEXXS75NV2JC4HZZ9`: that primitive is `conway::plugin::
# kill_group` now, one implementation reached through the facade instead of
# a hand-copy in this crate). Still needed for `PersistentSession::drop`'s
# own synchronous, best-effort group SIGKILL (`Drop` cannot `await` the
# graceful `kill_group`, so it sends `nix::sys::signal::kill(-pgid,
# SIGKILL)` directly) -- see `session.rs`'s own module doc.
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
# Board item 01M0TV8MSFRHHQ5BNZV3NHZCEW: this crate's tests reach
# `conway::test_support` (the shared `build_conway`/`test_builder` wiring
# that used to be hand-rolled per test file), which is behind the facade's
# off-by-default `test-support` feature. Dev-only: nothing in `src/` may
# name it.
conway = { path = "../conway", features = ["test-support"] }
# Test-only: builds a real, in-memory `Conway` (fake backend/store/gate/
# router) to drive a real subprocess plugin's tool through a real turn end
# to end -- the exact precedent `conway-plugin-skeleton`'s own
# `tests/skeleton_end_to_end.rs` establishes for exercising a plugin through
# the runtime with zero network. Neither is a new dependency to the
# workspace (C-04).
conway-core = { path = "../conway-core" }
conway-testkit = { path = "../conway-testkit" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
