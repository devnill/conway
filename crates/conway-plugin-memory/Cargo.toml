[package]
name = "conway-plugin-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "First-party plugin (board item 01M09P2T8E5M292WMSMS64CVC4): conway.memory, a mutable MemoryStore injected into context by a ContextHook -- a REWORK of the label-based curator this crate used to ship"

# Board item 01KZDC3JQ7W4DY1MG6MBCVB2DV: this crate is versioned WITH the
# workspace (`version.workspace = true`, same as every other crate here),
# not independently -- see `conway-plugin-skeleton`'s own Cargo.toml doc
# comment and `docs/embedding.md`'s "First-party plugin tier" section for
# the full reasoning, restated here rather than re-derived: this crate
# carries none of `conway-core`'s own strict-semver discipline
# (ARCHITECTURE.md §2), because that discipline exists specifically for
# crates third-party plugins depend on, and this plugin is, from `conway`'s
# own point of view, just another consumer of the public `conway`/
# `conway::plugin` surface.

[dependencies]
# The ONLY workspace crate this plugin depends on -- the public facade, the
# exact surface a third-party plugin author gets (GP-03/P-6). Board item
# 01M09P2T8E5M292WMSMS64CVC4 reworked this plugin from a `Curator`
# (path selection over existing records) to a `ContextHook` (injection of
# freeform text that never was a record) plus a `MemoryStore`-backed tool
# surface -- both reachable through this exact same facade dependency, no
# new workspace edge.
conway = { path = "../conway" }
# Tool argument schemas (`RememberArgs`/`ForgetArgs`) -- a leaf crate with no
# workspace/`conway-core` types of its own, the same footing
# `conway-plugin-skills`/`conway-plugin-stepguard` already depend on it on.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Board item 01M0TV8MSFRHHQ5BNZV3NHZCEW: this crate's tests reach
# `conway::test_support` (the shared `build_conway`/`test_builder` wiring
# that used to be hand-rolled per test file), which is behind the facade's
# off-by-default `test-support` feature. Dev-only: nothing in `src/` may
# name it.
conway = { path = "../conway", features = ["test-support"] }
# Test-only: builds a real, in-memory `Conway` (fake backend/store/gate/
# router) to drive this plugin's hook/tools through a real turn end to end --
# the same precedent `conway-plugin-skeleton`'s own
# `tests/skeleton_end_to_end.rs` and `conway-plugin-history`'s own
# `tests/history_end_to_end.rs` establish. Already a pinned workspace
# dependency, not a new one (C-04).
conway-testkit = { path = "../conway-testkit" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
