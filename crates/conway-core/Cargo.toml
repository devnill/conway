[package]
name = "conway-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Domain types and port traits for the conway agent harness"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
schemars = { workspace = true }
ulid = { workspace = true }
# `transcript::TranscriptResolver`'s memoization cache (board item
# 01KZVYVTVWRH20R6VJ6G3SWTJ6, "Stage 1a"): an external, non-workspace crate,
# so it does not touch the T1 no-workspace-dependency invariant this crate
# otherwise holds.
lru = { workspace = true }
# `ports::capability`'s capability-edge version check (decision
# `01M189XS6Z9VKYENAHNY1B54CM`): `CapabilityRegistration::version` is a
# `semver::Version`, a consumer's requirement is a `semver::VersionReq`, and
# resolution is `req.matches(&version)`. Already in `Cargo.lock` at 1.0.28
# via `rustc_version` transitively -- promoting it to a direct dependency
# here adds no new lock entry.
semver = { workspace = true }
# `containment::resolve_candidate`'s tilde-expansion home-directory lookup
# (board item 01M10HSENWKTEE4G691XJXBH6T): already a `Cargo.lock` entry via
# `conway`'s own `directories::BaseDirs` use for `~/.conway/settings.json`
# (`crates/conway/src/config/discovery.rs`); reusing it here, rather than
# hand-rolling `$HOME`/`%USERPROFILE%` lookup a second time, is what lets a
# test that overrides those env vars observe ONE home-directory answer
# everywhere in the tree. An external, non-workspace crate, so it does not
# touch the T1 no-workspace-dependency invariant this crate otherwise holds.
directories = { workspace = true }

[dev-dependencies]
static_assertions = { workspace = true }
tempfile = { workspace = true }
