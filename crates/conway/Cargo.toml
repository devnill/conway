[package]
name = "conway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Embeddable facade over the conway agent harness: config, builder, session handle, and event stream"

[features]
# Backend selection (Anthropic vs. OpenAI-compatible vs. both) is runtime
# configuration (a `[backends.<id>].kind` entry in settings), not a
# build-time choice -- `conway-backends` (below) is therefore an ordinary,
# non-optional dependency and the harness always supports both common API
# flavours. There used to be `anthropic`/`openai-compat` cargo features
# here that gated that dependency; they were the wrong axis (they made
# "the base harness" itself something you had to recompile to get a
# backend from) and are gone. Board item 01KZACKE05ZNYTYR0TGV3550SD
# tracks the follow-on: backends as plugins, installed declaratively on the
# same surface a third party uses, rather than compiled or config-selected
# from a closed built-in set.
default = ["builtin-tools", "jsonl-store"]
builtin-tools = ["dep:conway-tools"]
jsonl-store = ["dep:conway-session"]
# Empty on purpose (WI-097 scope: config schema/discovery/merge only, no
# HTTP client). Declared so `#[cfg(feature = "metadata-refresh")]` in
# `config::model_metadata` does not trip `unexpected_cfgs` under `-D
# warnings`; the actual client implementation is a later work item's scope.
metadata-refresh = []

[dependencies]
conway-core = { path = "../conway-core" }
conway-runtime = { path = "../conway-runtime" }
conway-routing = { path = "../conway-routing" }
# Non-optional (see the [features] table's doc above): the harness always
# supports both common API flavours conway-backends ships (Anthropic,
# OpenAI-compatible); default features pull both in.
conway-backends = { path = "../conway-backends" }
conway-session = { path = "../conway-session", optional = true }
conway-tools = { path = "../conway-tools", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
globset = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# `config::trust` (board item 01KYT8SGX32CP56PRJNG72V2W5) digests a
# project's `permissions.json` for its content-scoped trust record.
# Already a workspace dependency used by `conway-core` and by
# `conway-runtime::permission::PermissionBroker`'s own `CacheKey` -- this
# is a THIRD consumer of the same pinned crate, not a new dependency
# (C-04).
blake3 = { workspace = true }

[dev-dependencies]
conway-core = { path = "../conway-core", features = ["fakes"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# S5's root-containment seam test needs real tempdirs/symlinks (a real
# filesystem is the only honest way to prove a symlink escape is denied) --
# already a pinned workspace dependency (conway-core/conway-runtime dev-deps
# use it for the same reason), not a new one (C-04).
tempfile = { workspace = true }
# context_probe_overlay_seam.rs drives `config.models.probe_on_startup`'s
# real `CapabilityProbe` HTTP round trip through `ConwayBuilder::build`
# end-to-end (board item 01KYXNBKWK2DZ7JE3VRKC5FRJB) -- already a pinned
# workspace dependency (`conway-backends/tests/capability_probe.rs` uses it
# for the identical mechanism, loopback-only, never a live/external
# endpoint), not a new one (C-04); this is the third consumer of the same
# pinned crate, same reasoning as the `blake3` addition above.
wiremock = { workspace = true }
