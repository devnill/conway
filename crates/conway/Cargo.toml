[package]
name = "conway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Embeddable facade over the conway agent harness: config, builder, session handle, and event stream"

[features]
# Board item 01KZHF270T3W8GZ7NM6DSNQ4MM: both provider-adapter dialects
# (Anthropic, OpenAI-compatible) moved to `conway-plugin-backends`, a
# first-party plugin this crate no longer depends on at all -- see
# `src/builder.rs`'s `construct_backend` and `crates/conway-cli/src/
# first_party_plugins.rs`'s backend arm for where a kind now resolves
# instead. There is therefore no backend-selection feature axis here any
# more (there never should have been one -- "the base harness" itself
# should not be something you recompile to get a backend from).
default = ["builtin-tools", "jsonl-store"]
builtin-tools = ["dep:conway-tools"]
# FORWARD DECLARATION -- read this before concluding what turning it off does.
# `jsonl-store` governs DEFAULT WIRING, not linkage. Turning it off stops
# `ConwayBuilder::build` from constructing a `JsonlSessionStore` for you (you
# must then call `with_session_store` yourself, and the build error says so),
# but it does NOT unlink the JSONL crate: `conway-runtime` depends on
# `conway-session` unconditionally (`crates/conway-runtime/Cargo.toml`), so it
# is compiled into every build of this facade regardless of this feature. A
# reader on default features -- which is everyone who has not thought about
# it -- would reasonably conclude the opposite from the name.
#
# Board item 01KZVYVTVWRH20R6VJ6G3SWTJ6 ("Cut the runtime's dependency on the
# JSONL adapter", Stage 1a) makes the name true by moving `TranscriptResolver`
# and the provenance helpers into core, and must delete this comment when it
# lands. Pinned meanwhile by the T5 guard in
# `crates/conway/tests/architecture_invariants.rs`.
jsonl-store = ["dep:conway-session"]
# Empty on purpose (WI-097 scope: config schema/discovery/merge only, no
# HTTP client). Declared so `#[cfg(feature = "metadata-refresh")]` in
# `config::model_metadata` does not trip `unexpected_cfgs` under `-D
# warnings`; the actual client implementation is a later work item's scope.
metadata-refresh = []
# Board item 01KZVYWNA24EYMPVW3NPGBW51M: forwards `conway-testkit` (fakes
# for every `conway-core` port trait) to a crate depending only on
# `conway` -- re-exported as `conway::testkit` when enabled (`src/lib.rs`).
# NOT default: a testkit that ships in every production build is dead
# weight. But unlike `conway-core`'s old `fakes` feature (enabled only
# under this crate's own `[dev-dependencies]`, so no third party could ever
# turn it on), this one lives in `[dependencies]` as an optional dep gated
# by this feature -- a crate depending on `conway` can write
# `conway = { version = "..", features = ["testkit"] }` and reach it. This
# is the fix for the inversion the item's spec named: conway's own tests
# reached ready-made doubles a third party could not reach at all.
testkit = ["dep:conway-testkit"]

[dependencies]
conway-core = { path = "../conway-core" }
conway-runtime = { path = "../conway-runtime" }
conway-session = { path = "../conway-session", optional = true }
conway-tools = { path = "../conway-tools", optional = true }
conway-testkit = { path = "../conway-testkit", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
globset = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# `config::trust` (board item 01KYT8SGX32CP56PRJNG72V2W5) digests a
# project's `permissions.json` for its content-scoped trust record.
# Already a workspace dependency used by `conway-core` and by
# `conway-runtime::permission::PermissionBroker`'s own `CacheKey` -- this
# is a THIRD consumer of the same pinned crate, not a new dependency
# (C-04).
blake3 = { workspace = true }

[dev-dependencies]
# Board item 01KZVYMMZJPPTFNQT3AEMJMEFH: `tests/architecture_invariants.rs`
# parses workspace manifests to pin the dependency-shaped invariants (T1, T4,
# T5). Already a workspace dependency used by four other crates, so this adds
# nothing new to the tree.
toml = { workspace = true }
# Dev-only, unconditional: this crate's own test suite always has the
# doubles available with no extra flag, the same way it did before the
# doubles moved out of `conway-core`. The `testkit` feature above (an
# OPTIONAL `[dependencies]` entry) is the separate, opt-in path a third
# party reaches the identical crate through -- this line does not replace
# that one; the two exist for different audiences (this workspace's own
# tests vs. an external consumer).
conway-testkit = { path = "../conway-testkit" }
# Board item 01KZFC43J1J06BM4CCWKCKHSNV: `conway` itself no longer depends on
# the routing engine ([dependencies], above, has no such edge -- that's the
# whole point of this crate becoming a first-party plugin). This
# dev-dependency exists ONLY so this crate's own test suite can drive the
# INSTALLED configuration end-to-end through a real `ConwayBuilder::
# with_router_factory(Arc::new(conway_plugin_routing::RoutingRouterFactory))`
# call -- see `tests/router_plugin_seam.rs` -- exercising the exact same
# `RouterFactory` path `conway-cli`'s `first_party_plugins::router_bundle`
# links for real. Never referenced from `src/`.
conway-plugin-routing = { path = "../conway-plugin-routing" }
# Board item 01KZHF270T3W8GZ7NM6DSNQ4MM: `conway` itself no longer depends
# on either provider-adapter dialect ([dependencies], above, has no such
# edge any more -- that is the whole point of this relocation). This
# dev-dependency exists ONLY so this crate's own test suite can drive the
# real `AnthropicBackendFactory`/`OpenAiCompatBackendFactory` through
# `ConwayBuilder::with_backend_factory` end-to-end -- the exact same
# `BackendFactory` path `conway-cli`'s `first_party_plugins::backend_bundle`
# links for real -- and so `[backends.<id>].kind = "anthropic"`/
# `"openai-compat"` config-derived fixtures already in this suite (`tests/
# builder.rs`, `context_probe_overlay_seam.rs`, and others) keep resolving
# to a real adapter rather than an "unknown kind" build error now that the
# facade compiles neither in directly. Never referenced from `src/`.
conway-plugin-backends = { path = "../conway-plugin-backends" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# S5's root-containment seam test needs real tempdirs/symlinks (a real
# filesystem is the only honest way to prove a symlink escape is denied) --
# already a pinned workspace dependency (conway-core/conway-runtime dev-deps
# use it for the same reason), not a new one (C-04).
tempfile = { workspace = true }
# context_probe_overlay_seam.rs drives `config.models.probe_on_startup`'s
# real `CapabilityProbe` HTTP round trip through `ConwayBuilder::build`
# end-to-end (board item 01KYXNBKWK2DZ7JE3VRKC5FRJB) -- already a pinned
# workspace dependency (`conway-plugin-backends/tests/capability_probe.rs`
# uses it for the identical mechanism, loopback-only, never a live/external
# endpoint), not a new one (C-04); this is the third consumer of the same
# pinned crate, same reasoning as the `blake3` addition above.
wiremock = { workspace = true }
