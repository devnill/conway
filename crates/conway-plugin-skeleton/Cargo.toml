[package]
name = "conway-plugin-skeleton"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "First-party plugin tier skeleton (board item 01KZDC3JQ7W4DY1MG6MBCVB2DV): a worked, non-default example plugin proving the tier's shape end to end, written entirely against the public conway:: plugin surface"

# Board item 01KZDC3JQ7W4DY1MG6MBCVB2DV: this crate is versioned WITH the
# workspace (`version.workspace = true`, same as every other crate here),
# not independently -- see `conway`'s `config::schema::PluginsConfig` doc
# and `docs/embedding.md`'s "First-party plugin tier" section for the full
# reasoning. It carries none of `conway-core`'s own strict-semver
# discipline (ARCHITECTURE.md §2): that discipline exists specifically
# because third-party plugins depend on `conway-core`'s port surface, and a
# first-party plugin is, from `conway`'s own point of view, just another
# consumer of the public `conway`/`conway::plugin` surface -- not a second
# thing granting the stability promise itself.

[dependencies]
# The ONLY workspace crate this plugin depends on -- the public facade, the
# exact surface a third-party plugin author gets (GP-03/P-6). It does NOT
# depend on `conway-core` directly: everything it needs (the `Plugin`/
# `Tool` traits and every type their methods name) is reachable through
# `conway::plugin` alone, which is the point being proven.
conway = { path = "../conway" }
# Data-type crates whose types appear in the public `Tool`/`Plugin` method
# signatures (`ToolSpec::schema`, `ToolCall::arguments`) but are
# deliberately NOT re-exported by `conway::plugin` (see that module's own
# doc: "name them in your own Cargo.toml, at the same version conway
# uses") -- a plugin author's own dependency, not conway's. All three are
# already pinned `[workspace.dependencies]` used throughout this tree, so
# this is not a new dependency to the workspace (C-04).
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
# `SkeletonAskTool`'s own `VersionReq` for `ctx.capabilities.call_versioned`
# (board item 01M0WWPA70E8YAAN981EK10D3D) -- `conway::plugin` does not
# re-export `semver` itself (only the `conway-core` types built on top of
# it), so a caller that needs to SPELL a `semver::VersionReq` names this
# crate directly, the same "name it in your own Cargo.toml" convention the
# comment above states for serde/serde_json/schemars. Already a direct
# dependency of `conway-core` and a pinned `[workspace.dependencies]` entry
# -- not a new dependency to the workspace (C-04).
semver = { workspace = true }

[dev-dependencies]
# Test-only: this crate's own `skeleton_ask_*` tests build a REAL
# `conway_plugin_ui::ConwayUiPlugin` registration to drive `SkeletonAskTool`
# against the actual Edge B provider it calls in production, rather than a
# hand-rolled fixture provider that would only prove this crate's OWN
# JSON-shape assumptions agree with themselves. Test-only and one-directional
# (this crate's `src/` names no `conway-plugin-ui` type) -- both crates are
# already in this workspace, so this is not a new dependency to the
# workspace (C-04).
conway-plugin-ui = { path = "../conway-plugin-ui" }
# Board item 01M0TV8MSFRHHQ5BNZV3NHZCEW: this crate's tests reach
# `conway::test_support` (the shared `build_conway`/`test_builder` wiring
# that used to be hand-rolled per test file), which is behind the facade's
# off-by-default `test-support` feature. Dev-only: nothing in `src/` may
# name it.
conway = { path = "../conway", features = ["test-support"] }
# Test-only: builds a real, in-memory `Conway` (fake backend/store/gate/
# router) to drive this plugin's tool through a real turn end to end,
# exactly the precedent `conway`'s own `tests/plugin_surface.rs` and
# `interactive_tools.rs` already establish for exercising a plugin through
# the runtime with zero network. `conway-core` is needed alongside
# `conway-testkit` because the test also constructs plain domain-type
# fixtures (`PermissionDecision`, `ContentBlock`, ids) that are not doubles
# at all -- neither is a new dependency to the workspace (C-04).
conway-core = { path = "../conway-core" }
conway-testkit = { path = "../conway-testkit" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Test-only: `tests/file_prompt_command.rs`'s own fixture markdown file, a
# real file `FilePromptCommand::from_file` reads from disk -- already a
# pinned `[workspace.dependencies]` entry used throughout this tree (e.g.
# `conway-plugin-discover`, `conway-plugin-skills`), not a new dependency
# to the workspace (C-04).
tempfile = { workspace = true }
