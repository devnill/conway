[package]
name = "conway-plugin-goal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "First-party plugin: conway.goal, a one-sentence standing goal the operator sets with the built-in /goal command, surfaced near the end of context and on the status line -- in DEFAULT_OPINION_SET, inert until /goal is used"

# Versioned WITH the workspace, like every other first-party plugin -- see
# `conway-plugin-skeleton`/`conway-plugin-compaction`/`conway-plugin-todo`'s
# own Cargo.toml doc comments for the full reasoning, restated here rather
# than re-derived: this crate carries none of `conway-core`'s strict-semver
# discipline, since that discipline exists for the crate third-party plugins
# depend on, and this is, from `conway`'s own point of view, just another
# consumer of the public `conway`/`conway::plugin` surface.

[dependencies]
# The ONLY workspace crate this plugin depends on -- the public facade, the
# exact surface a third-party plugin author gets. `Plugin`, `ContextHook`
# and `PluginStatusContribution` are all reachable through `conway::plugin`
# alone.
conway = { path = "../conway" }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# `serde_json::json!` for a `ContentBlock::ToolUse::arguments` fixture in
# `removing_persisted_notes_leaves_every_tool_call_result_pair_intact` --
# test-only; this crate's own production code never touches JSON at all
# (see the Cargo.toml doc comment above: it writes and reads a plain
# `String`, never a serialized shape).
serde_json = { workspace = true }
