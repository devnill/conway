[package]
name = "conway-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend adapters (Anthropic, OpenAI-compatible) for the conway agent harness"

[features]
default = ["anthropic", "openai-compat"]
anthropic = ["dep:reqwest", "dep:eventsource-stream"]
openai-compat = ["dep:reqwest", "dep:eventsource-stream"]

[dependencies]
conway-core = { path = "../conway-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
jsonschema = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
humantime-serde = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }
